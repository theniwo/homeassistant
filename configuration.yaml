shell_command:
  snom_dnd_set: >-
    python3 /config/scripts/snom_dnd_control.py --desired "{{ desired }}"
  snom_dnd_status: >-
    python3 /config/scripts/snom_dnd_control.py --status
  fritzbox_tam_set: >-
    python3 /config/scripts/fritzbox_tam_control.py --enabled "{{ enabled }}"

input_text:
  tomorrow_shift_status:
    name: Tomorrow shift status
    max: 255
    initial: "Status wird aktualisiert"
    icon: mdi:calendar-clock

input_select:
  bt_disconnect_mode:
    name: BT disconnect mode
    options:
      - Zum Wecker
      - Zum Schlafen
      - Zur Uhrzeit
    icon: mdi:bluetooth-off
  gnome_dnd_niwo_policy:
    name: GNOME niwo DND policy
    options:
      - Follow global
      - Force on
      - Force off
    icon: mdi:bell-cog
  gnome_dnd_work_policy:
    name: GNOME work DND policy
    options:
      - Follow global
      - Force on
      - Force off
    icon: mdi:bell-cog
  snom_dnd_policy:
    name: Snom DND policy
    options:
      - Follow global
      - Force on
      - Force off
    icon: mdi:bell-cog
  samsung_s25_dnd_policy:
    name: Samsung S25 DND policy
    options:
      - Follow global
      - Force on
      - Force off
    icon: mdi:bell-cog

input_number:
  work_sim_voicemail_prompt_timeout:
    name: Work SIM voicemail prompt timeout
    min: 1
    max: 30
    step: 1
    unit_of_measurement: min
    mode: slider
    icon: mdi:voicemail
  bt_sleep_disconnect_offset_hours:
    name: BT sleep delay
    min: 0
    max: 6
    step: 0.25
    unit_of_measurement: h
    mode: slider
    icon: mdi:timer-outline

input_datetime:
  bt_disconnect_time:
    name: BT disconnect time
    has_date: false
    has_time: true
    icon: mdi:clock-outline
