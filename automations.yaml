- id: '1791378679790'
  alias: Calendar - Shifts - Alexa Bluetooth disconnect
  description: Mutes the bedroom Echo briefly while disconnecting Bluetooth before the calculated alarm.
  triggers:
  - trigger: time_pattern
    seconds: /1
    id: second_tick
  conditions:
  - condition: template
    value_template: '{% set alarm_lead_minutes = (states(''input_number.alarm_offset'') | float(1) * 60) | int %} {% set bluetooth_lead_seconds = states(''input_number.bt_disconnect_offset'') | int(60) %} {% set current_key = now().strftime(''%Y-%m-%d %H:%M:%S'') %} {% set early_today = today_at(states(''input_datetime.early_shift_start'')) - timedelta(minutes=alarm_lead_minutes, seconds=bluetooth_lead_seconds) %} {% set late_today = today_at(states(''input_datetime.late_shift_start'')) - timedelta(minutes=alarm_lead_minutes, seconds=bluetooth_lead_seconds) %} {% set candidates = [early_today.strftime(''%Y-%m-%d %H:%M:%S''), (early_today + timedelta(days=1)).strftime(''%Y-%m-%d %H:%M:%S''), late_today.strftime(''%Y-%m-%d %H:%M:%S''), (late_today + timedelta(days=1)).strftime(''%Y-%m-%d %H:%M:%S'')] %} {{ current_key in candidates }}'
  actions:
  - variables:
      current_time_key: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      early_today_key: '{% set alarm_lead_minutes = (states(''input_number.alarm_offset'') | float(1) * 60) | int %} {% set bluetooth_lead_seconds = states(''input_number.bt_disconnect_offset'') | int(60) %} {% set target = today_at(states(''input_datetime.early_shift_start'')) - timedelta(minutes=alarm_lead_minutes, seconds=bluetooth_lead_seconds) %} {{ target.strftime(''%Y-%m-%d %H:%M:%S'') }}'
      early_tomorrow_key: '{% set alarm_lead_minutes = (states(''input_number.alarm_offset'') | float(1) * 60) | int %} {% set bluetooth_lead_seconds = states(''input_number.bt_disconnect_offset'') | int(60) %} {% set target = today_at(states(''input_datetime.early_shift_start'')) - timedelta(minutes=alarm_lead_minutes, seconds=bluetooth_lead_seconds) + timedelta(days=1) %} {{ target.strftime(''%Y-%m-%d %H:%M:%S'') }}'
      late_today_key: '{% set alarm_lead_minutes = (states(''input_number.alarm_offset'') | float(1) * 60) | int %} {% set bluetooth_lead_seconds = states(''input_number.bt_disconnect_offset'') | int(60) %} {% set target = today_at(states(''input_datetime.late_shift_start'')) - timedelta(minutes=alarm_lead_minutes, seconds=bluetooth_lead_seconds) %} {{ target.strftime(''%Y-%m-%d %H:%M:%S'') }}'
      late_tomorrow_key: '{% set alarm_lead_minutes = (states(''input_number.alarm_offset'') | float(1) * 60) | int %} {% set bluetooth_lead_seconds = states(''input_number.bt_disconnect_offset'') | int(60) %} {% set target = today_at(states(''input_datetime.late_shift_start'')) - timedelta(minutes=alarm_lead_minutes, seconds=bluetooth_lead_seconds) + timedelta(days=1) %} {{ target.strftime(''%Y-%m-%d %H:%M:%S'') }}'
  - variables:
      early_match_today: '{{ current_time_key == early_today_key }}'
      early_match_tomorrow: '{{ current_time_key == early_tomorrow_key }}'
      late_match_today: '{{ current_time_key == late_today_key }}'
      late_match_tomorrow: '{{ current_time_key == late_tomorrow_key }}'
  - variables:
      shift_name: '{{ ''Frühschicht'' if (early_match_today | bool) or (early_match_tomorrow | bool) else ''Spätschicht'' }}'
      shift_day_offset: '{{ 1 if (early_match_tomorrow | bool) or (late_match_tomorrow | bool) else 0 }}'
      bluetooth_lead_seconds: '{{ states(''input_number.bt_disconnect_offset'') | int(60) }}'
      previous_mute_state: '{{ state_attr(''media_player.schlafzimmer'', ''is_volume_muted'') | default(false) | bool }}'
  - variables:
      calendar_query_start: '{{ (today_at(''00:00'') + timedelta(days=shift_day_offset | int)).isoformat() }}'
      calendar_query_end: '{{ (today_at(''00:00'') + timedelta(days=(shift_day_offset | int) + 1)).isoformat() }}'
  - action: calendar.get_events
    target:
      entity_id: calendar.shifts
    data:
      start_date_time: '{{ calendar_query_start }}'
      end_date_time: '{{ calendar_query_end }}'
    response_variable: shift_calendar
  - variables:
      shift_found: "{% set events = shift_calendar.get('calendar.shifts', {}).get('events', []) %} {% set ns = namespace(found=false) %} {% for event in events %}\n  {% if (event.summary | default('') | lower | trim) == (shift_name | lower) %}\n    {% set ns.found = true %}\n  {% endif %}\n{% endfor %} {{ ns.found }}"
  - condition: template
    value_template: '{{ shift_found | bool }}'
  - if:
    - condition: template
      value_template: '{{ (bluetooth_lead_seconds | int) > 5 and not (previous_mute_state | bool) }}'
    then:
    - action: media_player.volume_mute
      target:
        entity_id: media_player.schlafzimmer
      data:
        is_volume_muted: true
      continue_on_error: true
    - delay:
        seconds: 1
  - action: media_player.select_source
    target:
      entity_id: media_player.schlafzimmer
    data:
      source: Local Speaker
    continue_on_error: true
  - if:
    - condition: template
      value_template: '{{ (bluetooth_lead_seconds | int) > 5 and not (previous_mute_state | bool) }}'
    then:
    - delay:
        seconds: 3
    - action: media_player.volume_mute
      target:
        entity_id: media_player.schlafzimmer
      data:
        is_volume_muted: '{{ previous_mute_state | bool }}'
      continue_on_error: true
  mode: single
