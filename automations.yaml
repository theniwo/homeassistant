- id: '1702215033034'
  alias: Fenster Wohnzimmer auf
  description: Stores the current living room target and uses the configured no-heating target while either window is open.
  trigger:
  - type: opened
    platform: device
    device_id: f9798d86f248c6fb1c8ad0050218b685
    entity_id: f2451cebf7baa596a319d15aebd97a1b
    domain: binary_sensor
    for:
      hours: 0
      minutes: 0
      seconds: 10
  - type: opened
    platform: device
    device_id: 273da5061f9510e795e103c425d2fbd6
    entity_id: fb1abe95addf288a9f069055178b0f86
    domain: binary_sensor
    for:
      hours: 0
      minutes: 0
      seconds: 10
  condition:
  - condition: template
    value_template: "{{ is_state('binary_sensor.shellydw2_07a36f_door', 'on') or is_state('binary_sensor.shellydw2_a4cf12f4307a_door', 'on') }}"
  action:
  - variables:
      window_open_off_temperature: "{{ states('input_number.window_open_temp') | float(4) }}"
  - if:
    - condition: template
      value_template: "{{ states('climate.shellytrv_8cf68118891f') == 'heat' and (state_attr('climate.shellytrv_8cf68118891f', 'temperature') | float(0)) > window_open_off_temperature }}"
    then:
    - service: input_number.set_value
      data_template:
        value: '{{ state_attr(''climate.shellytrv_8cf68118891f'',''temperature'') }}'
        entity_id: input_number.whz_target_temp
      enabled: true
  - action: script.turn_on
    target:
      entity_id: script.retry_living_room_radiator_target
    data:
      variables:
        command_type: temperature
        target_temperature: '{{ window_open_off_temperature }}'
  mode: parallel
  max: 10
