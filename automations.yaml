- id: '1704669783034'
  alias: Heating booster - target temperature
  description: Turns the living room radiator booster on only when its target temperature is above the configured minimum.
  trigger:
  - platform: state
    entity_id:
    - climate.shellytrv_8cf68118891f
    - input_number.heating_min_temp
    - switch.shellyplusplugs_e465b8416794_switch_0
  - platform: homeassistant
    event: start
  condition: []
  action:
  - choose:
    - conditions:
      - condition: template
        value_template: >-
          {{ is_state('climate.shellytrv_8cf68118891f', 'heat')
             and (state_attr('climate.shellytrv_8cf68118891f', 'temperature') | float(-1000))
               > (states('input_number.heating_min_temp') | float(1000)) }}
      sequence:
      - service: switch.turn_on
        target:
          entity_id: switch.shellyplusplugs_e465b8416794_switch_0
    default:
    - service: switch.turn_off
      target:
        entity_id: switch.shellyplusplugs_e465b8416794_switch_0
  mode: restart
