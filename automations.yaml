- id: calendar_shifts_snom_dnd_work_mode
  alias: Calendar - Shifts - Snom DND during Work mode
  description: Keeps Snom DND enabled while the calendar Work mode helper is active and releases it when Work ends unless another DND mode still needs it.
  triggers:
  - trigger: state
    entity_id: input_boolean.work_mode_state
    to: 'on'
    id: work_on
  - trigger: state
    entity_id: input_boolean.work_mode_state
    to: 'off'
    id: work_off
  - trigger: state
    entity_id: input_boolean.snom_dnd_status
    to: 'off'
    id: snom_dnd_off
  - trigger: time_pattern
    minutes: /1
    id: work_dnd_check
  - trigger: homeassistant
    event: start
    id: startup
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.work_mode_state
        state: 'on'
      sequence:
      - action: shell_command.snom_dnd_set
        data:
          desired: 'on'
        response_variable: snom_work_result
      - if: '{{ snom_work_result[''returncode''] == 0 }}'
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.snom_dnd_state
    - conditions:
      - condition: trigger
        id: work_off
      - condition: state
        entity_id: input_boolean.sleep_mode_state
        state: 'off'
      - condition: state
        entity_id: input_boolean.dnd_override
        state: 'off'
      - condition: state
        entity_id: input_boolean.snom_dnd_state
        state: 'on'
      sequence:
      - action: shell_command.snom_dnd_set
        data:
          desired: 'off'
        response_variable: snom_work_result
      - if: '{{ snom_work_result[''returncode''] == 0 }}'
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.snom_dnd_state
  mode: single
- id: '1791356584531'
  alias: Calendar - Shifts - Samsung Sleep mode
  description: Coordinates Samsung Sleep mode and Snom DND with calendar shifts, checking actual phone DND state to avoid toggling manual choices.
  triggers:
  - trigger: template
    id: early_sleep_on
    value_template: "{% set t = states('input_datetime.early_shift_start').split(':') %} {% set shift_minutes = (t[0] | int) * 60 + (t[1] | int) %} {% set alarm_lead =\n  ((states('input_number.alarm_offset') | float(1)) * 60)\n  | int\n%} {% set sleep_lead =\n  ((states('input_number.sleep_duration') | float(8)) * 60)\n  | int\n%} {% set target = (shift_minutes - alarm_lead - sleep_lead) % 1440 %} {{ (now().hour * 60 + now().minute) == target }}"
  - trigger: template
    id: late_sleep_on
    value_template: "{% set t = states('input_datetime.late_shift_start').split(':') %} {% set shift_minutes = (t[0] | int) * 60 + (t[1] | int) %} {% set alarm_lead =\n  ((states('input_number.alarm_offset') | float(1)) * 60)\n  | int\n%} {% set sleep_lead =\n  ((states('input_number.sleep_duration') | float(8)) * 60)\n  | int\n%} {% set target = (shift_minutes - alarm_lead - sleep_lead) % 1440 %} {{ (now().hour * 60 + now().minute) == target }}"
  - trigger: template
    id: early_dnd_on
    value_template: '{% set t = states(''input_datetime.early_shift_start'').split('':'') %} {% set shift_minutes = (t[0] | int) * 60 + (t[1] | int) %} {% set alarm_lead = ((states(''input_number.alarm_offset'') | float(1)) * 60) | int %} {% set sleep_lead = ((states(''input_number.sleep_duration'') | float(8)) * 60) | int %} {% set dnd_lead = ((states(''input_number.dnd_offset'') | float(1) * 60) | int) %} {% set target = (shift_minutes - alarm_lead - sleep_lead - dnd_lead) % 1440 %} {{ (now().hour * 60 + now().minute) == target }}'
  - trigger: template
    id: late_dnd_on
    value_template: '{% set t = states(''input_datetime.late_shift_start'').split('':'') %} {% set shift_minutes = (t[0] | int) * 60 + (t[1] | int) %} {% set alarm_lead = ((states(''input_number.alarm_offset'') | float(1)) * 60) | int %} {% set sleep_lead = ((states(''input_number.sleep_duration'') | float(8)) * 60) | int %} {% set dnd_lead = ((states(''input_number.dnd_offset'') | float(1) * 60) | int) %} {% set target = (shift_minutes - alarm_lead - sleep_lead - dnd_lead) % 1440 %} {{ (now().hour * 60 + now().minute) == target }}'
  - trigger: template
    id: early_sleep_off
    value_template: "{% set t = states('input_datetime.early_shift_start').split(':') %} {% set shift_minutes = (t[0] | int) * 60 + (t[1] | int) %} {% set alarm_lead =\n  ((states('input_number.alarm_offset') | float(1)) * 60)\n  | int\n%} {% set target = (shift_minutes - alarm_lead) % 1440 %} {{ (now().hour * 60 + now().minute) == target }}"
  - trigger: template
    id: late_sleep_off
    value_template: "{% set t = states('input_datetime.late_shift_start').split(':') %} {% set shift_minutes = (t[0] | int) * 60 + (t[1] | int) %} {% set alarm_lead =\n  ((states('input_number.alarm_offset') | float(1)) * 60)\n  | int\n%} {% set target = (shift_minutes - alarm_lead) % 1440 %} {{ (now().hour * 60 + now().minute) == target }}"
  - trigger: template
    id: free_sleep_on
    value_template: '{% set t = states(''input_datetime.free_shift_start'').split('':'') %}{% set start = (t[0] | int) * 60 + (t[1] | int) %}{% set alarm = (states(''input_number.alarm_offset'') | float(1) * 60) | int %}{% set sleep = (states(''input_number.sleep_duration'') | float(8) * 60) | int %}{{ now().hour * 60 + now().minute == (start - alarm - sleep) % 1440 }}'
  - trigger: template
    id: free_dnd_on
    value_template: '{% set t = states(''input_datetime.free_shift_start'').split('':'') %}{% set start = (t[0] | int) * 60 + (t[1] | int) %}{% set alarm = (states(''input_number.alarm_offset'') | float(1) * 60) | int %}{% set sleep = (states(''input_number.sleep_duration'') | float(8) * 60) | int %}{% set dnd = ((states(''input_number.dnd_offset'') | float(1) * 60) | int) %}{{ now().hour * 60 + now().minute == (start - alarm - sleep - dnd) % 1440 }}'
  - trigger: template
    id: free_sleep_off
    value_template: '{% set t = states(''input_datetime.free_shift_start'').split('':'') %}{% set start = (t[0] | int) * 60 + (t[1] | int) %}{% set alarm = (states(''input_number.alarm_offset'') | float(1) * 60) | int %}{{ now().hour * 60 + now().minute == (start - alarm) % 1440 }}'
  actions:
  - variables:
      shift_name: '{{ ''Frühschicht'' if trigger.id.startswith(''early_'') else (''Spätschicht'' if trigger.id.startswith(''late_'') else ''Freischicht'') }}'
      shift_start_entity: '{{ ''input_datetime.early_shift_start'' if trigger.id.startswith(''early_'') else (''input_datetime.late_shift_start'' if trigger.id.startswith(''late_'') else ''input_datetime.free_shift_start'') }}'
      total_lead_minutes: '{% set alarm_lead = ((states(''input_number.alarm_offset'') | float(1)) * 60) | int %}{% set sleep_lead = ((states(''input_number.sleep_duration'') | float(8)) * 60) | int %}{% set dnd_lead = ((states(''input_number.dnd_offset'') | float(1) * 60) | int) %}{% if trigger.id.endswith(''_dnd_on'') %}{{ alarm_lead + sleep_lead + dnd_lead }}{% elif trigger.id.endswith(''_sleep_on'') %}{{ alarm_lead + sleep_lead }}{% else %}{{ alarm_lead }}{% endif %}'
  - variables:
      calendar_day_offset: "{% set t = states(shift_start_entity).split(':') %} {% set shift_minutes = (t[0] | int) * 60 + (t[1] | int) %} {{\n  1\n  if shift_minutes - (total_lead_minutes | int) < 0\n  else 0\n}}"
      calendar_query_start: "{{\n  (now() + timedelta(days=calendar_day_offset | int))\n  .replace(hour=0, minute=0, second=0, microsecond=0)\n  .isoformat()\n}}"
      calendar_query_end: "{{\n  (now() + timedelta(days=(calendar_day_offset | int) + 1))\n  .replace(hour=0, minute=0, second=0, microsecond=0)\n  .isoformat()\n}}"
  - action: calendar.get_events
    target:
      entity_id: calendar.shifts
    data:
      start_date_time: '{{ calendar_query_start }}'
      end_date_time: '{{ calendar_query_end }}'
    response_variable: shift_calendar
  - variables:
      shift_found: '{% set target_day = (now() + timedelta(days=calendar_day_offset | int)).weekday() %}{% set titles = shift_calendar.get(''calendar.shifts'', {}).get(''events'', []) | map(attribute=''summary'') | map(''lower'') | map(''trim'') | list %}{% if target_day >= 5 %}false{% elif trigger.id.startswith(''free_'') %}{{ ''freischicht'' in titles or ''support standby'' in titles }}{% elif trigger.id.startswith(''early_'') %}{{ ''frühschicht'' in titles or ''sv früh'' in titles or ''svv früh'' in titles }}{% else %}{{ ''spätschicht'' in titles or ''sv spät'' in titles or ''svv spät'' in titles }}{% endif %}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id.endswith(''_dnd_on'') and (shift_found | bool) }}'
      - condition: state
        entity_id: input_boolean.snom_dnd_state
        state: 'off'
      - condition: state
        entity_id: input_boolean.dnd_override
        state: 'off'
      sequence:
      - action: shell_command.snom_dnd_set
        data:
          desired: 'on'
        response_variable: snom_dnd_result
      - if: '{{ snom_dnd_result[''returncode''] == 0 }}'
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.snom_dnd_state
    - conditions:
      - condition: template
        value_template: '{{ trigger.id.endswith(''_sleep_off'') and (shift_found | bool) }}'
      - condition: state
        entity_id: input_boolean.snom_dnd_state
        state: 'on'
      - condition: state
        entity_id: input_boolean.dnd_override
        state: 'off'
      - condition: template
        value_template: '{{ not is_state(''input_select.work_schedule_mode'', ''Krank'') }}'
      - condition: state
        entity_id: input_boolean.work_mode_state
        state: 'off'
      sequence:
      - action: shell_command.snom_dnd_set
        data:
          desired: 'off'
        response_variable: snom_dnd_result
      - if: '{{ snom_dnd_result[''returncode''] == 0 }}'
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.snom_dnd_state
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id.endswith(''_dnd_on'') and (shift_found | bool) }}'
      - condition: state
        entity_id: input_boolean.fritz_ab_state
        state: 'off'
      - condition: state
        entity_id: input_boolean.dnd_override
        state: 'off'
      sequence:
      - action: shell_command.fritzbox_tam_set
        data:
          enabled: 'on'
        response_variable: fritzbox_tam_result
      - if: '{{ fritzbox_tam_result[''returncode''] == 0 }}'
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.fritz_ab_state
    - conditions:
      - condition: template
        value_template: '{{ trigger.id.endswith(''_sleep_off'') and (shift_found | bool) }}'
      - condition: state
        entity_id: input_boolean.fritz_ab_state
        state: 'on'
      - condition: state
        entity_id: input_boolean.dnd_override
        state: 'off'
      - condition: template
        value_template: '{{ not is_state(''input_select.work_schedule_mode'', ''Krank'') }}'
      sequence:
      - action: shell_command.fritzbox_tam_set
        data:
          enabled: 'off'
        response_variable: fritzbox_tam_result
      - if: '{{ fritzbox_tam_result[''returncode''] == 0 }}'
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.fritz_ab_state
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''early_dnd_on'', ''late_dnd_on'', ''free_dnd_on''] and (shift_found | bool) }}'
      - condition: state
        entity_id: input_boolean.dnd_override
        state: 'off'
      sequence:
      - action: notify.mobile_app_sm_s931b
        data:
          message: command_dnd
          data:
            command: priority_only
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''early_sleep_on'', ''late_sleep_on'', ''free_sleep_on''] and (shift_found | bool) }}'
      - condition: state
        entity_id: input_boolean.sleep_mode_state
        state: 'off'
      sequence:
