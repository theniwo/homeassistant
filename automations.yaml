- id: calendar_shifts_free_day_heating_20261007
  alias: Calendar - Shifts - Freischicht-Heizplan
  initial_state: false
  description: Recreates the Shelly Freischicht weekly schedules in Home Assistant.
  triggers:
  - trigger: time
    at: 06:00:00
    id: living_morning_on
  - trigger: time
    at: 07:00:00
    id: living_morning_off
  - trigger: time
    at: 06:30:00
    id: office_morning_on
  - trigger: time
    at: '15:30:00'
    id: office_afternoon_off
  - trigger: time
    at: '15:30:00'
    id: living_afternoon_on
  - trigger: time
    at: '22:00:00'
    id: living_evening_off_2200
  - trigger: time
    at: '23:59:00'
    id: living_evening_off_2359
  - trigger: time
    at: '10:00:00'
    id: living_weekend_on
  - trigger: time
    at: '11:00:00'
    id: office_weekend_on
  - trigger: time
    at: '12:00:00'
    id: office_weekend_off
  - trigger: time
    at: 07:00:00
    id: bedroom_morning_off
  - trigger: time
    at: '11:00:00'
    id: bedroom_weekend_off
  - trigger: time
    at: '14:00:00'
    id: bedroom_afternoon_on
  - trigger: time
    at: '15:00:00'
    id: bedroom_afternoon_off
  - trigger: time
    at: '21:30:00'
    id: bedroom_night_on_weekdays
  - trigger: time
    at: '23:59:00'
    id: bedroom_night_on_weekend
  actions:
  - action: homeassistant.update_entity
    target:
      entity_id: calendar.shifts
  - delay:
      seconds: 2
  - action: calendar.get_events
    target:
      entity_id: calendar.shifts
    data:
      start_date_time: '{{ today_at(''00:00'').isoformat() }}'
      end_date_time: '{{ (today_at(''00:00'') + timedelta(days=1)).isoformat() }}'
    response_variable: shift_calendar
  - variables:
      shift_titles: "{{ shift_calendar.get('calendar.shifts', {}).get('events', [])\n   | map(attribute='summary') | map('lower') | list }}"
      has_work_shift: "{{ shift_titles | select('search', '(früh|spät|mittel|mittag|schicht)') | list\n   | reject('search', 'frei') | list | length > 0 }}"
  - variables:
      has_free_day_event: '{{ shift_titles | select(''search'', ''(4tw-frei|urlaub)'') | list | length > 0 }}'
  - condition: template
    value_template: '{% set fixed_weekday_ids = [''living_morning_on'', ''living_morning_off'', ''office_morning_on'', ''office_afternoon_off'', ''living_afternoon_on'', ''living_evening_off_2200''] %} {{ trigger.id not in fixed_weekday_ids or has_free_day_event | bool }}'
  - condition: template
    value_template: '{{ not (has_work_shift | bool) }}'
  - condition: template
    value_template: "{% set day = now().weekday() %} {% if trigger.id in ['living_morning_on', 'living_morning_off', 'office_morning_on', 'office_afternoon_off', 'living_afternoon_on', 'bedroom_morning_off'] %}\n  {{ day < 5 }}\n{% elif trigger.id in ['living_evening_off_2200', 'bedroom_night_on_weekdays'] %}\n  {{ day < 4 or day == 6 }}\n{% elif trigger.id in ['living_evening_off_2359', 'bedroom_night_on_weekend'] %}\n  {{ day in [4, 5] }}\n{% elif trigger.id in ['living_weekend_on', 'office_weekend_on', 'office_weekend_off', 'bedroom_weekend_off'] %}\n  {{ day >= 5 }}\n{% else %}\n  true\n{% endif %}"
  - condition: state
    entity_id: person.niwo
    state: home
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''living_morning_on'', ''living_afternoon_on'', ''living_weekend_on''] }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.retry_living_room_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: 21
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''living_morning_off'', ''living_evening_off_2200'', ''living_evening_off_2359''] }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.retry_living_room_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: 4
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''office_morning_on'', ''office_weekend_on''] }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.shelly_retry_office_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: 21
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''office_afternoon_off'', ''office_weekend_off''] }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.shelly_retry_office_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: 4
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''bedroom_afternoon_on''] }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.shelly_retry_bedroom_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: 20
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''bedroom_morning_off'', ''bedroom_weekend_off'', ''bedroom_afternoon_off''] }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.shelly_retry_bedroom_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: 4
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''bedroom_night_on_weekdays''] }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.shelly_retry_bedroom_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: 18
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''bedroom_night_on_weekend'' }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.shelly_retry_bedroom_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: 18
  mode: queued
  max: 10
- id: calendar_shifts_heating_return_sync_20261007
  alias: Calendar - Shifts - Heizplan bei Rückkehr
  description: Restores the current shift or free-day heating state after arriving home.
  triggers:
  - trigger: homeassistant
    event: start
    id: ha_start
  - trigger: zone
    entity_id: person.niwo
    zone: zone.home
    event: enter
  - trigger: template
    id: homeoffice_living_preheat
    value_template: >-
      {% set early = states('input_datetime.early_shift_start').split(':') %}
      {% set late = states('input_datetime.late_shift_start').split(':') %}
      {% set free = states('input_datetime.free_shift_start').split(':') %}
      {% set alarm = (states('input_number.alarm_offset') | float(1) * 60) | int %}
      {% set lead = (states('input_number.heating_preheat_offset') | float(1) * 60) | int %}
      {% set starts = [
        (early[0] | int) * 60 + (early[1] | int),
        (late[0] | int) * 60 + (late[1] | int),
        (free[0] | int) * 60 + (free[1] | int)
      ] %}
      {% set minute = now().hour * 60 + now().minute %}
      {{ minute in [(starts[0] - alarm - lead) % 1440, (starts[1] - alarm - lead) % 1440, (starts[2] - alarm - lead) % 1440] }}
  - trigger: template
    id: sick_living_preheat
    value_template: "{% set minute = now().hour * 60 + now().minute %} {% set alarm_lead = (states('input_number.alarm_offset') | float(1) * 60) | int %} {% set preheat = ((states('input_number.heating_preheat_offset') | float(1) * 60) | int) %} {% set early = states('input_datetime.early_shift_start').split(':') %} {% set late = states('input_datetime.late_shift_start').split(':') %} {% set free = states('input_datetime.free_shift_start').split(':') %} {% set early_start = (early[0] | int) * 60 + (early[1] | int) %} {% set late_start = (late[0] | int) * 60 + (late[1] | int) %} {% set free_start = (free[0] | int) * 60 + (free[1] | int) %} {{ is_state('input_select.work_schedule_mode', 'Krank') and minute in [\n  (early_start - alarm_lead - preheat) % 1440,\n  (late_start - alarm_lead - preheat) % 1440,\n  (free_start - alarm_lead - preheat) % 1440\n] }}"
  - trigger: template
    id: homeoffice_office_preheat
    value_template: >-
      {% set early = states('input_datetime.early_shift_start').split(':') %}
      {% set late = states('input_datetime.late_shift_start').split(':') %}
      {% set free = states('input_datetime.free_shift_start').split(':') %}
      {% set lead = (states('input_number.heating_preheat_offset') | float(1) * 60) | int %}
      {% set starts = [
        (early[0] | int) * 60 + (early[1] | int),
        (late[0] | int) * 60 + (late[1] | int),
        (free[0] | int) * 60 + (free[1] | int)
      ] %}
      {% set minute = now().hour * 60 + now().minute %}
      {{ minute in [(starts[0] - lead) % 1440, (starts[1] - lead) % 1440, (starts[2] - lead) % 1440] }}
  - trigger: template
    id: free_day_preheat
    value_template: "{% set wake = states('input_datetime.vacation_wake_time').split(':') %} {% set wake_minutes = (wake[0] | int) * 60 + (wake[1] | int) %} {% set lead = ((states('input_number.heating_preheat_offset') | float(1) * 60) | int) %} {{ now().hour * 60 + now().minute == (wake_minutes - lead) % 1440 and not is_state('input_boolean.sleep_mode_state', 'on') }}"
  - trigger: template
    id: homeoffice_evening_preheat
    value_template: >-
      {% set early_end = states('input_datetime.early_shift_end').split(':') %}
      {% set late_start = states('input_datetime.late_shift_start').split(':') %}
      {% set late_end = states('input_datetime.late_shift_end').split(':') %}
      {% set free_start = states('input_datetime.free_shift_start').split(':') %}
      {% set early_end_minutes = (early_end[0] | int) * 60 + (early_end[1] | int) %}
      {% set late_start_minutes = (late_start[0] | int) * 60 + (late_start[1] | int) %}
      {% set late_end_minutes = (late_end[0] | int) * 60 + (late_end[1] | int) %}
      {% set free_start_minutes = (free_start[0] | int) * 60 + (free_start[1] | int) %}
      {% set free_end_minutes = free_start_minutes + late_end_minutes - late_start_minutes %}
      {% set lead = (states('input_number.heating_preheat_offset') | float(1) * 60) | int %}
      {% set ends = [early_end_minutes, late_end_minutes, free_end_minutes] %}
      {% set minute = now().hour * 60 + now().minute %}
      {{ minute in [(ends[0] - lead) % 1440, (ends[1] - lead) % 1440, (ends[2] - lead) % 1440] }}
  - trigger: template
    id: homeoffice_start
    value_template: >-
      {% set early = states('input_datetime.early_shift_start').split(':') %}
      {% set late = states('input_datetime.late_shift_start').split(':') %}
      {% set free = states('input_datetime.free_shift_start').split(':') %}
      {% set starts = [
        (early[0] | int) * 60 + (early[1] | int),
        (late[0] | int) * 60 + (late[1] | int),
        (free[0] | int) * 60 + (free[1] | int)
      ] %}
      {% set minute = now().hour * 60 + now().minute %}
      {{ minute in starts }}
  - trigger: template
    id: homeoffice_end
    value_template: >-
      {% set early_end = states('input_datetime.early_shift_end').split(':') %}
      {% set late_start = states('input_datetime.late_shift_start').split(':') %}
      {% set late_end = states('input_datetime.late_shift_end').split(':') %}
      {% set free_start = states('input_datetime.free_shift_start').split(':') %}
      {% set early_end_minutes = (early_end[0] | int) * 60 + (early_end[1] | int) %}
      {% set late_start_minutes = (late_start[0] | int) * 60 + (late_start[1] | int) %}
      {% set late_end_minutes = (late_end[0] | int) * 60 + (late_end[1] | int) %}
      {% set free_start_minutes = (free_start[0] | int) * 60 + (free_start[1] | int) %}
      {% set free_end_minutes = free_start_minutes + late_end_minutes - late_start_minutes %}
      {% set cooldown = (states('input_number.heating_cooldown_offset') | float(0.5) * 60) | int %}
      {% set ends = [early_end_minutes, late_end_minutes, free_end_minutes] %}
      {% set minute = now().hour * 60 + now().minute %}
      {{ minute in [(ends[0] - cooldown) % 1440, (ends[1] - cooldown) % 1440, (ends[2] - cooldown) % 1440] }}
  - trigger: time
    at: 00:01:00
    id: daily_schedule_refresh
  - trigger: state
    entity_id:
    - input_boolean.sleep_mode_state
    - input_datetime.vacation_wake_time
    - input_select.whz_sleep_profile
    - input_number.whz_target_temp
    - input_number.az_target_temp
    - input_number.sz_target_temp
    - input_number.heating_preheat_offset
    - input_number.sleep_duration
    - input_number.alarm_offset
    - input_datetime.early_shift_start
    - input_datetime.early_shift_end
    - input_datetime.late_shift_start
    - input_datetime.late_shift_end
    - input_datetime.free_shift_start
    - input_select.work_schedule_mode
    - input_number.sick_temp_offset
    - input_number.heating_min_temp
    - input_number.heating_cooldown_offset
  - trigger: state
    entity_id: binary_sensor.shellydw2_07a36f_door
    id: window_close_living
  - trigger: state
    entity_id: binary_sensor.shellydw2_a4cf12f4307a_door
    id: window_close_balcony
  - trigger: state
    entity_id: binary_sensor.shellydw2_aa9da4_door
    id: window_close_office
  - trigger: state
    entity_id: binary_sensor.shellydw2_6c3e7e_door
    id: window_close_office_large
  - trigger: state
    entity_id: binary_sensor.shellydw2_08f9e051afef_door
    id: window_close_bedroom
  actions:
  - action: homeassistant.update_entity
    target:
      entity_id: calendar.shifts
  - delay:
      seconds: 2
  - action: calendar.get_events
    target:
      entity_id: calendar.shifts
    data:
      start_date_time: '{{ today_at(''00:00'').isoformat() }}'
      end_date_time: '{{ (today_at(''00:00'') + timedelta(days=1)).isoformat() }}'
    response_variable: shift_calendar
  - action: calendar.get_events
    target:
      entity_id: calendar.deutschland_by
    data:
      start_date_time: '{{ today_at(''00:00'').isoformat() }}'
      end_date_time: '{{ (today_at(''00:00'') + timedelta(days=1)).isoformat() }}'
    response_variable: holiday_calendar
  - action: calendar.get_events
    target:
      entity_id: calendar.feiertage_in_deutschland
    data:
      start_date_time: '{{ today_at(''00:00'').isoformat() }}'
      end_date_time: '{{ (today_at(''00:00'') + timedelta(days=1)).isoformat() }}'
    response_variable: regional_holiday_calendar
  - variables:
      shift_titles: "{{ shift_calendar.get('calendar.shifts', {}).get('events', [])\n   | map(attribute='summary') | map('lower') | map('trim') | list }}"
      early_shift_found: "{% set ns = namespace(found=false) %} {% for title in shift_titles %}\n  {% if title in ['frühschicht', 'sv früh', 'svv früh'] %}\n    {% set ns.found = true %}\n  {% endif %}\n{% endfor %} {{ ns.found }}"
      late_shift_found: "{% set ns = namespace(found=false) %} {% for title in shift_titles %}\n  {% if title in ['spätschicht', 'sv spät', 'svv spät'] %}\n    {% set ns.found = true %}\n  {% endif %}\n{% endfor %} {{ ns.found }}"
      free_home_day_found: '{% set ns = namespace(found=false) %}{% for title in shift_titles %}{% if title in [''4tw-frei'', ''urlaub''] %}{% set ns.found = true %}{% endif %}{% endfor %}{{ ns.found }}'
      current_minute: '{{ now().hour * 60 + now().minute }}'
      current_weekday: '{{ now().weekday() }}'
      shift_start_minutes: '{% set entity = ''input_datetime.early_shift_start'' if early_shift_found | bool else ''input_datetime.late_shift_start'' %} {% set value = states(entity).split('':'') %} {{ (value[0] | int) * 60 + (value[1] | int) }}'
      shift_end_minutes: '{% set entity = ''input_datetime.early_shift_end'' if early_shift_found | bool else ''input_datetime.late_shift_end'' %} {% set value = states(entity).split('':'') %} {{ (value[0] | int) * 60 + (value[1] | int) }}'
      shift_lead_minutes: '{{ ((states(''input_number.heating_preheat_offset'') | float(1) * 60) | int) }}'
      alarm_lead_minutes: '{{ (states(''input_number.alarm_offset'') | float(1) * 60) | int }}'
      bedroom_lead_minutes: '{{ ((states(''input_number.heating_preheat_offset'') | float(1) * 60) | int) }}'
      sleep_lead_minutes: '{{ (states(''input_number.sleep_duration'') | float(8) * 60) | int }}'
      living_lead_minutes: '{{ ((states(''input_number.heating_preheat_offset'') | float(1) * 60) | int) }}'
      alarm_minutes: '{{ (shift_start_minutes | int) - (alarm_lead_minutes | int) }}'
      sleep_on_minutes: '{{ (alarm_minutes | int) - (sleep_lead_minutes | int) }}'
      morning_living_minutes: '{{ (alarm_minutes | int) - (living_lead_minutes | int) }}'
      free_shift_event_found: '{% set ns = namespace(found=false) %}{% for title in shift_titles %}{% if ''freischicht'' in title or ''support standby'' in title %}{% set ns.found = true %}{% endif %}{% endfor %}{{ ns.found }}'
      mode_is_sick: '{{ is_state(''input_select.work_schedule_mode'', ''Krank'') }}'
      mode_is_free_shift: '{{ is_state(''input_select.work_schedule_mode'', ''Freischicht'') }}'
      sick_offset: '{{ states(''input_number.sick_temp_offset'') | float(2) if mode_is_sick | bool else 0 }}'
      minimum_temperature: '{{ states(''input_number.heating_min_temp'') | float(4) }}'
      window_open_off_temperature: "{{ states('input_number.window_open_temp') | float(4) }}"
      living_window_open: "{{ is_state('binary_sensor.shellydw2_07a36f_door', 'on') or is_state('binary_sensor.shellydw2_a4cf12f4307a_door', 'on') }}"
      office_window_open: "{{ is_state('binary_sensor.shellydw2_aa9da4_door', 'on') or is_state('binary_sensor.shellydw2_6c3e7e_door', 'on') }}"
      bedroom_window_open: "{{ is_state('binary_sensor.shellydw2_08f9e051afef_door', 'on') }}"
      weekday: '{{ now().weekday() < 5 }}'
      holiday_found: '{% set bavaria = holiday_calendar.get(''calendar.deutschland_by'', {}).get(''events'', []) %}{% set regional = regional_holiday_calendar.get(''calendar.feiertage_in_deutschland'', {}).get(''events'', []) | map(attribute=''summary'') | map(''lower'') | select(''search'', ''mariä himmelfahrt'') | list %}{{ bavaria | length > 0 or regional | length > 0 }}'
      shift_work_active: '{{ (early_shift_found | bool or late_shift_found | bool) and not (mode_is_sick | bool) and not (mode_is_free_shift | bool) and (weekday | bool) }}'
      free_shift_active: '{{ (weekday | bool) and not (free_home_day_found | bool) and not (mode_is_sick | bool) and (mode_is_free_shift | bool or free_shift_event_found | bool or ((shift_titles | length == 0) and not (holiday_found | bool))) }}'
      free_day_active: '{{ (free_home_day_found | bool) or not (weekday | bool) or ((holiday_found | bool) and not (early_shift_found | bool or late_shift_found | bool or free_shift_event_found | bool)) or (mode_is_sick | bool) or not (shift_work_active | bool) and not (free_shift_active | bool) }}'
      free_shift_start_minutes: '{% set t = states(''input_datetime.free_shift_start'').split('':'') %}{{ (t[0] | int) * 60 + (t[1] | int) }}'
      shift_duration_minutes: '{{ (shift_end_minutes | int) - (shift_start_minutes | int) }}'
      free_shift_end_minutes: '{{ (free_shift_start_minutes | int) + (shift_duration_minutes | int) }}'
      schedule_start_minutes: '{{ shift_start_minutes | int if shift_work_active | bool else free_shift_start_minutes | int }}'
      schedule_alarm_minutes: '{{ (schedule_start_minutes | int) - (alarm_lead_minutes | int) }}'
      schedule_sleep_on_minutes: '{{ (schedule_alarm_minutes | int) - (sleep_lead_minutes | int) }}'
      living_preheat_start: '{{ ((schedule_alarm_minutes | int) - (living_lead_minutes | int)) % 1440 }}'
      sick_start_minutes: '{{ shift_start_minutes | int if early_shift_found | bool or late_shift_found | bool else free_shift_start_minutes | int }}'
      sick_wake_minutes: '{{ (sick_start_minutes | int) - (alarm_lead_minutes | int) }}'
      sick_living_preheat_start: '{{ (sick_wake_minutes | int) - (living_lead_minutes | int) }}'
      cooldown_minutes: '{{ ((states(''input_number.heating_cooldown_offset'') | float(0.5) * 60) | int) }}'
      free_office_start: '{{ (free_shift_start_minutes | int) - (shift_lead_minutes | int) }}'
      free_office_end: '{{ (free_shift_end_minutes | int) - (cooldown_minutes | int) }}'
      home_day_start_minutes: "{% set entity = 'input_datetime.early_shift_start' if mode_is_sick | bool else 'input_datetime.vacation_wake_time' %} {% set t = states(entity).split(':') %}{{ (t[0] | int) * 60 + (t[1] | int) }}"
      vacation_wake_minutes: "{% set t = states('input_datetime.vacation_wake_time').split(':') %}{{ (t[0] | int) * 60 + (t[1] | int) }}"
      vacation_preheat_start_minutes: '{{ ((vacation_wake_minutes | int) - (living_lead_minutes | int)) % 1440 }}'
      living_profile_uses_vacation: "{{ not (mode_is_sick | bool) and (is_state('input_select.whz_sleep_profile', 'Urlaub') or (is_state('input_select.whz_sleep_profile', 'Automatisch') and (not (weekday | bool) or (free_home_day_found | bool)))) }}"
      in_vacation_preheat_window: "{% set minute = current_minute | int %} {% set start = (vacation_preheat_start_minutes | int) %} {% set wake = vacation_wake_minutes | int %} {{ (start < wake and start <= minute < wake) or (start > wake and (minute >= start or minute < wake)) }}"
      living_windows_closed: "{{ not is_state('binary_sensor.shellydw2_07a36f_door', 'on') and not is_state('binary_sensor.shellydw2_a4cf12f4307a_door', 'on') }}"
      living_sleep_profile_warmup: "{{ is_state('input_boolean.sleep_mode_state', 'on') and (living_profile_uses_vacation | bool) and (in_vacation_preheat_window | bool) and is_state('person.niwo', 'home') and (living_windows_closed | bool) }}"
      should_heat_living: >-
        {% set minute = current_minute | int %}
        {% set day_start = ((home_day_start_minutes | int) - (living_lead_minutes | int)) % 1440 %}
        {% set shift_start = (shift_start_minutes | int) % 1440 %}
        {% set free_start = (free_shift_start_minutes | int) % 1440 %}
        {% set shift_morning_start = (living_preheat_start | int) % 1440 %}
        {% set free_morning_start = ((schedule_alarm_minutes | int) - (living_lead_minutes | int)) % 1440 %}
        {% set evening_start = (((shift_end_minutes | int) if shift_work_active | bool else (free_shift_end_minutes | int)) - (shift_lead_minutes | int)) % 1440 %}
        {% if shift_morning_start < shift_start %}
          {% set in_shift_morning_window = minute >= shift_morning_start and minute < shift_start %}
        {% else %}
          {% set in_shift_morning_window = minute >= shift_morning_start or minute < shift_start %}
        {% endif %}
        {% if free_morning_start < free_start %}
          {% set in_free_morning_window = minute >= free_morning_start and minute < free_start %}
        {% else %}
          {% set in_free_morning_window = minute >= free_morning_start or minute < free_start %}
        {% endif %}
        {% if mode_is_sick | bool %}
          {{ minute >= day_start }}
        {% elif is_state('input_boolean.sleep_mode_state', 'on') %}
          false
        {% elif shift_work_active | bool %}
          {{ in_shift_morning_window or minute >= evening_start }}
        {% elif free_shift_active | bool %}
          {{ in_free_morning_window or minute >= evening_start }}
        {% elif free_day_active | bool %}
          {{ minute >= day_start }}
        {% else %}
          false
        {% endif %}
      should_heat_office: >-
        {% set minute = current_minute | int %}
        {% if shift_work_active | bool %}
          {% set start = ((shift_start_minutes | int) - (shift_lead_minutes | int)) % 1440 %}
          {% set end = ((shift_end_minutes | int) - (cooldown_minutes | int)) % 1440 %}
        {% elif free_shift_active | bool %}
          {% set start = (free_office_start | int) % 1440 %}
          {% set end = (free_office_end | int) % 1440 %}
        {% else %}
          {% set start = ((home_day_start_minutes | int) - (shift_lead_minutes | int)) % 1440 %}
          {% set end = start %}
        {% endif %}
        {% if is_state('input_boolean.sleep_mode_state', 'on') %}
          false
        {% elif free_day_active | bool and not (shift_work_active | bool) and not (free_shift_active | bool) %}
          {{ minute >= start }}
        {% elif start < end %}
          {{ start <= minute < end }}
        {% elif start > end %}
          {{ minute >= start or minute < end }}
        {% else %}
          false
        {% endif %}
      bedroom_target: '{% set minute = current_minute | int %}{% set minimum = minimum_temperature | float(4) %}{% set target = [minimum_temperature | float(4), (states(''input_number.sz_target_temp'') | float(18)) + (sick_offset | float(0))] | max %}{% set preheat_start = ((schedule_sleep_on_minutes | int) - (bedroom_lead_minutes | int)) % 1440 %}{% set alarm_minute = schedule_alarm_minutes | int %}{% if is_state(''input_boolean.sleep_mode_state'', ''on'') %}{{ target }}{% elif (shift_work_active | bool or (free_shift_active | bool and (free_shift_event_found | bool or mode_is_free_shift | bool))) and not (mode_is_sick | bool) and ((preheat_start <= minute < alarm_minute) if preheat_start < alarm_minute else (minute >= preheat_start or minute < alarm_minute)) %}{{ target }}{% else %}{{ minimum }}{% endif %}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ should_heat_living | bool }}'
      - condition: state
        entity_id: person.niwo
        state: home
      - condition: template
        value_template: '{{ not is_state(''binary_sensor.shellydw2_07a36f_door'', ''on'') }}'
      - condition: template
        value_template: '{{ not is_state(''binary_sensor.shellydw2_a4cf12f4307a_door'', ''on'') }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.retry_living_room_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: '{{ [minimum_temperature | float(4), states(''input_number.whz_target_temp'') | float(22) + (sick_offset | float(0))] | max }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ living_window_open | bool }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.retry_living_room_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: '{{ window_open_off_temperature }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ should_heat_office | bool }}'
      - condition: state
        entity_id: person.niwo
        state: home
      - condition: template
        value_template: '{{ not is_state(''binary_sensor.shellydw2_aa9da4_door'', ''on'') }}'
      - condition: template
        value_template: '{{ not is_state(''binary_sensor.shellydw2_6c3e7e_door'', ''on'') }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.shelly_retry_office_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: '{{ [minimum_temperature | float(4), states(''input_number.az_target_temp'') | float(21) + (sick_offset | float(0))] | max }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ office_window_open | bool }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.shelly_retry_office_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: '{{ window_open_off_temperature }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ bedroom_target | float(4) > (minimum_temperature | float(4)) }}'
      - condition: state
        entity_id: person.niwo
        state: home
      - condition: template
        value_template: '{{ not is_state(''binary_sensor.shellydw2_08f9e051afef_door'', ''on'') }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.shelly_retry_bedroom_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: '{{ bedroom_target | float(minimum_temperature | float(4)) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ bedroom_window_open | bool }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.shelly_retry_bedroom_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: '{{ window_open_off_temperature }}'
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ not (should_heat_living | bool) and not (living_sleep_profile_warmup | bool) and not (living_window_open | bool) and (not is_state('input_boolean.sleep_mode_state', 'on') or (mode_is_sick | bool)) }}"
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.retry_living_room_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: '{{ minimum_temperature | float(4) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not (should_heat_office | bool) and not (office_window_open | bool) }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.shelly_retry_office_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: '{{ minimum_temperature | float(4) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ bedroom_target | float(4) <= (minimum_temperature | float(4)) and not (bedroom_window_open | bool) }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.shelly_retry_bedroom_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: '{{ minimum_temperature | float(4) }}'
  mode: queued
  max: 20
- id: calendar_shifts_pill_reminder_20261008
  alias: Calendar - Shifts - Pill reminder
  description: Announces a pill reminder before a scheduled work shift.
  triggers:
  - trigger: template
    id: early_pill_reminder
    value_template: '{% set shift_start = states(''input_datetime.early_shift_start'').split('':'') %} {% set shift_minutes = (shift_start[0] | int) * 60 + (shift_start[1] | int) %} {% set pill_lead_minutes = ((states(''input_number.pill_morning_offset'') | float(0.25) * 60) | int) %} {{ now().hour * 60 + now().minute == (shift_minutes - pill_lead_minutes) % 1440 }}'
  - trigger: template
    id: late_pill_reminder
    value_template: '{% set shift_start = states(''input_datetime.late_shift_start'').split('':'') %} {% set shift_minutes = (shift_start[0] | int) * 60 + (shift_start[1] | int) %} {% set pill_lead_minutes = ((states(''input_number.pill_morning_offset'') | float(0.25) * 60) | int) %} {{ now().hour * 60 + now().minute == (shift_minutes - pill_lead_minutes) % 1440 }}'
  actions:
  - variables:
      shift_name: '{{ ''Frühschicht'' if trigger.id == ''early_pill_reminder'' else ''Spätschicht'' }}'
      shift_start_entity: '{{ ''input_datetime.early_shift_start'' if trigger.id == ''early_pill_reminder'' else ''input_datetime.late_shift_start'' }}'
      pill_lead_minutes: '{{ ((states(''input_number.pill_morning_offset'') | float(0.25) * 60) | int) }}'
  - variables:
      calendar_day_offset: '{% set shift_start = states(shift_start_entity).split('':'') %} {% set shift_minutes = (shift_start[0] | int) * 60 + (shift_start[1] | int) %} {{ 1 if shift_minutes - (pill_lead_minutes | int) < 0 else 0 }}'
  - condition: template
    value_template: '{{ not is_state(''input_select.work_schedule_mode'', ''Krank'') and (today_at(''00:00'') + timedelta(days=calendar_day_offset | int)).weekday() < 5 }}'
  - variables:
      calendar_query_start: '{{ (today_at(''00:00'') + timedelta(days=calendar_day_offset | int)).isoformat() }}'
      calendar_query_end: '{{ (today_at(''00:00'') + timedelta(days=(calendar_day_offset | int) + 1)).isoformat() }}'
  - action: calendar.get_events
    target:
      entity_id: calendar.shifts
    data:
      start_date_time: '{{ calendar_query_start }}'
      end_date_time: '{{ calendar_query_end }}'
    response_variable: shift_calendar
  - variables:
      shift_found: "{% set events = shift_calendar.get('calendar.shifts', {}).get('events', []) %} {% set ns = namespace(found=false) %} {% for event in events %}\n  {% if (event.summary | default('') | lower | trim) == (shift_name | lower) %}\n    {% set ns.found = true %}\n  {% endif %}\n{% endfor %} {{ ns.found }}"
  - condition: template
    value_template: '{{ shift_found | bool }}'
  - action: script.alexa_output_with_configured_volume
    data:
      output_type: announce
      output_target: media_player.uberall
      volume_targets:
      - media_player.schlafzimmer
      - media_player.arbeitszimmer
      - media_player.kuche
      - media_player.wohnzimmer
      - media_player.badezimmer
      message: "{% if pill_lead_minutes | int == 0 %}\n  Denk daran, deine Tabletten einzunehmen. Deine Schicht beginnt jetzt!\n{% else %}\nDenk daran, deine Tabletten einzunehmen. Deine {{ shift_name }} beginnt in\n{{ pill_lead_minutes }} Minuten.\n{% endif %}"
