      late_alarm_time: '{% set t = states(''input_datetime.late_shift_start'').split('':'') %} {% set start = (t[0] | int) * 60 + (t[1] | int) %} {% set lead = (states(''input_number.alarm_offset'') | float(1) * 60) | int %} {% set alarm = (start - lead) % 1440 %} {{ ''%02d:%02d'' | format(alarm // 60, alarm % 60) }}'
      free_alarm_time: '{% set t = states(''input_datetime.free_shift_start'').split('':'') %} {% set start = (t[0] | int) * 60 + (t[1] | int) %} {% set lead = (states(''input_number.alarm_offset'') | float(1) * 60) | int %} {% set alarm = (start - lead) % 1440 %} {{ ''%02d:%02d'' | format(alarm // 60, alarm % 60) }}'
  - choose:
