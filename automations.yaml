- id: sleep_mode_enforce_rooms
  alias: Sleep Mode - Enforce room shutdown
  description: Runs the living and work room Alexa off routines, turns off other lights, and leaves the hallway lit while Sleep Mode is active and Enforce Sleep is enabled.
  triggers:
  - trigger: state
    entity_id: input_boolean.sleep_mode_state
    to: 'on'
    id: sleep_enabled
  - trigger: state
    entity_id: input_boolean.enforce_sleep
    to: 'on'
    id: enforcement_enabled
  conditions:
  - condition: state
    entity_id: input_boolean.sleep_mode_state
    state: 'on'
  - condition: state
    entity_id: input_boolean.enforce_sleep
    state: 'on'
  actions:
  - action: media_player.play_media
    target:
      entity_id: media_player.wohnzimmer
    data:
      media_content_type: routine
      media_content_id: Wohnzimmer aus
    continue_on_error: true
  - delay: 00:00:02
  - action: media_player.play_media
    target:
      entity_id: media_player.arbeitszimmer
    data:
      media_content_type: routine
      media_content_id: Arbeitszimmer aus
    continue_on_error: true
  - variables:
      sleep_lights_to_turn_off: "{{ states.light\n   | rejectattr('entity_id', 'in', [\n       'light.stehlampe_schlafzimmer_licht',\n       'light.nachttischlampe_licht',\n       'light.flur_vorne_licht',\n       'light.flur_mitte_licht_2',\n       'light.flur_hinten_licht_2'\n     ])\n   | map(attribute='entity_id') | list }}"
  - action: light.turn_off
    target:
      entity_id: '{{ sleep_lights_to_turn_off }}'
    continue_on_error: true
  - action: switch.turn_off
    target:
      entity_id:
      - switch.deckenlicht_kuche_switch_0
      - switch.deckenlicht_kuche_switch_1
    continue_on_error: true
  - action: light.turn_on
    target:
      entity_id:
      - light.stehlampe_schlafzimmer_licht
      - light.nachttischlampe_licht
    continue_on_error: true
  - action: light.turn_on
    target:
      entity_id:
      - light.flur_vorne_licht
      - light.flur_mitte_licht_2
      - light.flur_hinten_licht_2
    continue_on_error: true
  mode: restart
- id: sleep_mode_reset_enforce_sleep
  alias: Sleep Mode - Reset Enforce Sleep
  description: Applies the selected Enforce Sleep reset mode when Sleep Mode ends.
  triggers:
  - trigger: state
