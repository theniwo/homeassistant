        target:
          entity_id: input_boolean.enforce_sleep
    - conditions:
      - condition: state
        entity_id: input_select.enforce_sleep_reset_mode
        state: Normally Off
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.enforce_sleep
  mode: single
- id: calendar_shifts_living_sleep_profile_override_20261017
  alias: Calendar - Shifts - Wohnzimmer Sleep Mode heating profile
  description: Uses the selected or calendar-derived day profile to preheat the living room during Sleep Mode; without a scheduled shift, the comfort target remains set.
  triggers:
  - trigger: homeassistant
    event: start
    id: ha_start
  - trigger: state
    entity_id:
    - input_boolean.sleep_mode_state
    - input_select.whz_sleep_profile
    - input_select.work_schedule_mode
    - input_datetime.early_shift_start
    - input_datetime.early_shift_end
    - input_datetime.late_shift_start
    - input_datetime.late_shift_end
    - input_datetime.free_shift_start
    - input_datetime.vacation_wake_time
    - input_number.alarm_offset
    - input_number.heating_preheat_offset
    - input_number.whz_target_temp
    - input_number.heating_min_temp
    - calendar.shifts
    - calendar.deutschland_by
    - calendar.feiertage_in_deutschland
    - person.niwo
    - binary_sensor.shellydw2_07a36f_door
    - binary_sensor.shellydw2_a4cf12f4307a_door
    id: state_refresh
  - trigger: template
    id: profile_preheat
    value_template: "{% set selected = states('input_select.whz_sleep_profile') %} {% set early = states('input_datetime.early_shift_start').split(':') %} {% set late = states('input_datetime.late_shift_start').split(':') %} {% set free = states('input_datetime.free_shift_start').split(':') %} {% set vacation = states('input_datetime.vacation_wake_time').split(':') %} {% set early_start = (early[0] | int) * 60 + (early[1] | int) %} {% set late_start = (late[0] | int) * 60 + (late[1] | int) %} {% set free_start = (free[0] | int) * 60 + (free[1] | int) %} {% set vacation_start = (vacation[0] | int) * 60 + (vacation[1] | int) %} {% set alarm = (states('input_number.alarm_offset') | float(1) * 60) | int %} {% set lead = ((states('input_number.heating_preheat_offset') | float(1) * 60) | int) %} {% set current = now().hour * 60 + now().minute %} {% set candidates = [\n  (early_start - alarm - lead) % 1440,\n  (free_start - alarm - lead) % 1440,\n  (late_start - alarm - lead) % 1440,\n  (vacation_start\
      \ - lead) % 1440\n] %} {% if selected == 'Frühschicht' %}\n  {{ current == candidates[0] }}\n{% elif selected == 'Freischicht' %}\n  {{ current == candidates[1] }}\n{% elif selected == 'Spätschicht' %}\n  {{ current == candidates[2] }}\n{% elif selected == 'Urlaub' %}\n  {{ current == candidates[3] }}\n{% elif selected == 'Automatisch' %}\n  {{ current in candidates }}\n{% else %}false{% endif %}"
  - trigger: template
    id: profile_shift_start
    value_template: "{% set early = states('input_datetime.early_shift_start').split(':') %} {% set late = states('input_datetime.late_shift_start').split(':') %} {% set free = states('input_datetime.free_shift_start').split(':') %} {% set starts = [\n  (early[0] | int) * 60 + (early[1] | int),\n  (late[0] | int) * 60 + (late[1] | int),\n  (free[0] | int) * 60 + (free[1] | int)\n] %} {{ now().hour * 60 + now().minute in starts }}"
  conditions:
  - condition: state
    entity_id: input_boolean.sleep_mode_state
    state: 'on'
  - condition: template
    value_template: '{{ not is_state(''input_select.work_schedule_mode'', ''Krank'') }}'
  actions:
  - action: homeassistant.update_entity
    target:
      entity_id: calendar.shifts
  - delay:
      seconds: 2
  - action: calendar.get_events
    target:
      entity_id: calendar.shifts
    data:
      start_date_time: '{{ today_at(''00:00'').isoformat() }}'
      end_date_time: '{{ (today_at(''00:00'') + timedelta(days=1)).isoformat() }}'
    response_variable: shift_calendar
  - action: calendar.get_events
    target:
      entity_id: calendar.deutschland_by
    data:
      start_date_time: '{{ today_at(''00:00'').isoformat() }}'
      end_date_time: '{{ (today_at(''00:00'') + timedelta(days=1)).isoformat() }}'
    response_variable: holiday_calendar
  - action: calendar.get_events
    target:
      entity_id: calendar.feiertage_in_deutschland
    data:
      start_date_time: '{{ today_at(''00:00'').isoformat() }}'
      end_date_time: '{{ (today_at(''00:00'') + timedelta(days=1)).isoformat() }}'
    response_variable: bavarian_holiday_calendar
  - variables:
      selected_profile: '{{ states(''input_select.whz_sleep_profile'') }}'
      event_titles: '{{ shift_calendar.get(''calendar.shifts'', {}).get(''events'', []) | map(attribute=''summary'') | map(''lower'') | map(''trim'') | list }}'
      early_shift_found: '{{ event_titles | select(''in'', [''frühschicht'', ''sv früh'', ''svv früh'']) | list | length > 0 }}'
      late_shift_found: '{{ event_titles | select(''in'', [''spätschicht'', ''sv spät'', ''svv spät'']) | list | length > 0 }}'
      free_shift_found: '{{ event_titles | select(''search'', ''(freischicht|support standby)'') | list | length > 0 }}'
      free_day_found: '{{ event_titles | select(''search'', ''(4tw-frei|urlaub)'') | list | length > 0 }}'
      weekday: '{{ now().weekday() < 5 }}'
      holiday_found: "{% set bavaria = holiday_calendar.get('calendar.deutschland_by', {}).get('events', []) %} {% set regional = bavarian_holiday_calendar.get('calendar.feiertage_in_deutschland', {}).get('events', [])\n  | map(attribute='summary') | map('lower') | select('search', 'mariä himmelfahrt') | list %}\n{{ bavaria | length > 0 or regional | length > 0 }}"
      automatic_profile: "{% if not (weekday | bool) or (free_day_found | bool) %}Urlaub {% elif is_state('input_select.work_schedule_mode', 'Freischicht') %}Freischicht {% elif early_shift_found | bool %}Frühschicht {% elif late_shift_found | bool %}Spätschicht {% elif free_shift_found | bool or (event_titles | length == 0 and not (holiday_found | bool)) %}Freischicht\n{% else %}Deaktiviert{% endif %}"
      effective_profile: '{{ automatic_profile if selected_profile == ''Automatisch'' else selected_profile }}'
      profile_start_entity: '{% if effective_profile == ''Frühschicht'' %}input_datetime.early_shift_start {% elif effective_profile == ''Spätschicht'' %}input_datetime.late_shift_start {% elif effective_profile == ''Freischicht'' %}input_datetime.free_shift_start {% elif effective_profile == ''Urlaub'' %}input_datetime.vacation_wake_time {% else %}input_datetime.early_shift_start{% endif %}'
      profile_start_minutes: '{% set parts = states(profile_start_entity).split('':'') %} {{ (parts[0] | int) * 60 + (parts[1] | int) }}'
      profile_preheat_start: '{% set lead = ((states(''input_number.heating_preheat_offset'') | float(1) * 60) | int) %} {% set alarm = 0 if effective_profile == ''Urlaub'' else (states(''input_number.alarm_offset'') | float(1) * 60) | int %} {{ ((profile_start_minutes | int) - alarm - lead) % 1440 }}'
      current_minute: '{{ now().hour * 60 + now().minute }}'
      in_profile_warmup: '{% set minute = current_minute | int %} {% set start = profile_start_minutes | int %} {% set preheat = profile_preheat_start | int %} {% if preheat < start %}{{ preheat <= minute < start }} {% elif preheat > start %}{{ minute >= preheat or minute < start }} {% else %}false{% endif %}'
      matching_calendar_shift: "{{ (effective_profile == 'Frühschicht' and (early_shift_found | bool))\n   or (effective_profile == 'Spätschicht' and (late_shift_found | bool))\n   or (effective_profile == 'Freischicht' and (free_shift_found | bool)) }}"
      profile_shift_schedule_active: "{{ (matching_calendar_shift | bool) or effective_profile == 'Freischicht' }}"
      profile_shift_has_started: '{{ (profile_shift_schedule_active | bool) and (current_minute | int >= profile_start_minutes | int) }}'
      windows_closed: "{{ not is_state('binary_sensor.shellydw2_07a36f_door', 'on')\n   and not is_state('binary_sensor.shellydw2_a4cf12f4307a_door', 'on') }}"
      window_open_off_temperature: "{{ states('input_number.window_open_temp') | float(4) }}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not (windows_closed | bool) }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.retry_living_room_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: '{{ window_open_off_temperature }}'
    - conditions:
      - condition: template
        value_template: '{{ effective_profile == ''Deaktiviert'' }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.retry_living_room_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: '{{ states(''input_number.heating_min_temp'') | float(4) }}'
    - conditions:
      - condition: template
        value_template: '{{ (profile_shift_has_started | bool) or (trigger.id == ''profile_shift_start'' and (profile_shift_schedule_active | bool)) }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.retry_living_room_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: '{{ states(''input_number.heating_min_temp'') | float(4) }}'
    - conditions:
      - condition: template
        value_template: '{{ (in_profile_warmup | bool) and is_state(''person.niwo'', ''home'') and (windows_closed | bool) }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.retry_living_room_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: '{{ states(''input_number.whz_target_temp'') | float(22) }}'
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''state_refresh'', ''ha_start''] or not is_state(''person.niwo'', ''home'') }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.retry_living_room_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: '{{ states(''input_number.heating_min_temp'') | float(4) }}'
  mode: queued
  max: 10

- id: system_backup_failure_telegram
  alias: System - Backups - Telegram bei Fehler
  description: Send a Telegram notification when an automatic Home Assistant backup fails.
  triggers:
    - trigger: state
      entity_id: event.backup_automatisches_backup
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.to_state is not none and
           trigger.to_state.attributes.event_type == "failed" }}
  actions:
    - action: telegram_bot.send_message
      data:
        parse_mode: plain_text
        message: >-
          ⚠️ Das automatische Home-Assistant-Backup ist fehlgeschlagen.
          Grund: {{ state_attr("event.backup_automatisches_backup", "failed_reason") or "Unbekannt" }}
  mode: single
- id: calendar_shifts_tomorrow_status_panel
  alias: Calendar - Shifts - Tomorrow status panel
  description: Refreshes the dashboard summary for tomorrow using the shift calendar and schedule helpers.
  triggers:
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: time
    at: input_datetime.alarm_setup_time
    id: daily_refresh
  - trigger: state
    entity_id:
    - input_datetime.early_shift_start
    - input_datetime.late_shift_start
    - input_datetime.free_shift_start
    - input_number.alarm_offset
    - input_number.sleep_duration
    - input_number.wind_down_offset
    - input_number.dnd_offset
    - input_select.work_schedule_mode
    id: schedule_changed
  actions:
  - action: homeassistant.update_entity
    target:
      entity_id: calendar.shifts
  - delay:
      seconds: 5
  - variables:
      tomorrow_start: '{{ (today_at(''00:00'') + timedelta(days=1)).isoformat() }}'
      tomorrow_end: '{{ (today_at(''00:00'') + timedelta(days=2)).isoformat() }}'
      tomorrow_weekday: '{{ (today_at(''00:00'') + timedelta(days=1)).weekday() }}'
  - action: calendar.get_events
    target:
      entity_id: calendar.shifts
    data:
      start_date_time: '{{ tomorrow_start }}'
      end_date_time: '{{ tomorrow_end }}'
    response_variable: tomorrow_calendar
  - variables:
      shift_titles: "{{ tomorrow_calendar.get('calendar.shifts', {}).get('events', [])
   | map(attribute='summary') | map('lower') | map('trim') | list }}"
      early_shift_found: "{{ shift_titles | select('search', 'früh') | list | length > 0 }}"
      late_shift_found: "{{ shift_titles | select('search', 'spät') | list | length > 0 }}"
      free_shift_found: "{{ shift_titles | select('search', '(freischicht|support standby)') | list | length > 0 }}"
      free_day_found: "{{ shift_titles | select('search', '(4tw-frei|urlaub)') | list | length > 0 }}"
      mode_is_sick: "{{ is_state('input_select.work_schedule_mode', 'Krank') }}"
      shift_start_entity: "{% if shift_titles | select('search', 'früh') | list | length > 0 %}input_datetime.early_shift_start{% elif shift_titles | select('search', 'spät') | list | length > 0 %}input_datetime.late_shift_start{% else %}input_datetime.free_shift_start{% endif %}"
      shift_label: "{% if shift_titles | select('search', '4tw-frei') | list | length > 0 %}4TW-Frei{% elif shift_titles | select('search', 'urlaub') | list | length > 0 %}Urlaub{% elif shift_titles | select('search', 'früh') | list | length > 0 %}Frühschicht{% elif shift_titles | select('search', 'spät') | list | length > 0 %}Spätschicht{% elif shift_titles | select('search', 'support standby') | list | length > 0 %}Support Standby{% elif shift_titles | select('search', 'freischicht') | list | length > 0 %}Freischicht{% else %}Kein Schichteintrag{% endif %}"
  - variables:
      shift_start_minutes: "{% set t = states(shift_start_entity).split(':') %}{{ (t[0] | int) * 60 + (t[1] | int) }}"
      alarm_lead_minutes: "{{ (states('input_number.alarm_offset') | float(1) * 60) | int }}"
      sleep_minutes: "{{ (states('input_number.sleep_duration') | float(9) * 60) | int }}"
      wind_down_minutes: "{{ (states('input_number.wind_down_offset') | float(2) * 60) | int }}"
      dnd_lead_minutes: "{{ ((states('input_number.dnd_offset') | float(1) * 60) | int) }}"
      alarm_raw_minutes: "{{ (shift_start_minutes | int) - (alarm_lead_minutes | int) }}"
      bedtime_raw_minutes: "{{ (shift_start_minutes | int) - (alarm_lead_minutes | int) - (sleep_minutes | int) }}"
      wind_down_raw_minutes: "{{ (shift_start_minutes | int) - (alarm_lead_minutes | int) - (sleep_minutes | int) - (wind_down_minutes | int) }}"
      dnd_raw_minutes: "{{ (bedtime_raw_minutes | int) - (dnd_lead_minutes | int) }}"
      alarm_is_planned: "{{ (tomorrow_weekday | int < 5) and not (free_day_found | bool) and not (mode_is_sick | bool) and (((early_shift_found | bool or late_shift_found | bool) and is_state('input_select.work_schedule_mode', 'Automatisch')) or (free_shift_found | bool)) }}"
      alarm_display: "{{ (today_at('00:00') + timedelta(days=1, minutes=(alarm_raw_minutes | int))).strftime('%H:%M') }}"
      bedtime_display: "{{ (today_at('00:00') + timedelta(days=1, minutes=(bedtime_raw_minutes | int))).strftime('%H:%M') }}"
      wind_down_display: "{{ (today_at('00:00') + timedelta(days=1, minutes=(wind_down_raw_minutes | int))).strftime('%H:%M') }}"
      dnd_display: "{{ (today_at('00:00') + timedelta(days=1, minutes=(dnd_raw_minutes | int))).strftime('%H:%M') }}"
  - action: input_text.set_value
    target:
      entity_id: input_text.tomorrow_shift_status
    data:
      value: >-
        {% if tomorrow_weekday | int >= 5 %}
          Wochenende · kein Wecker
        {% elif free_day_found | bool %}
          {{ shift_label }} · kein Wecker
        {% elif mode_is_sick | bool and shift_label != 'Kein Schichteintrag' %}
          {{ shift_label }} · Krankmodus · kein Wecker
        {% elif shift_label == 'Kein Schichteintrag' %}
          Kein Schichteintrag · kein Wecker
        {% elif not (alarm_is_planned | bool) %}
          {{ shift_label }} · kein Wecker (Arbeitsmodus {{ states('input_select.work_schedule_mode') }})
        {% else %}
          {{ shift_label }} · DND {{ dnd_display }} · Runterfahren {{ wind_down_display }} · Schlafenszeit {{ bedtime_display }} · Wecker {{ alarm_display }}
        {% endif %}
  mode: restart


- id: calendar_shifts_tomorrow_status_announcement
  alias: Calendar - Shifts - Tomorrow status announcement
  description: Announces the calendar result and planned alarm after the daily calendar check.
  triggers:
    - trigger: time
      at: input_datetime.alarm_setup_time
  actions:
    - delay:
        seconds: 20
    - action: script.calendar_shifts_announce_tomorrow_status
  mode: single
