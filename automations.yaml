- id: calendar_shifts_master_dnd_override
  alias: Calendar - Shifts - Master DND override
  description: Manually enables or disables Snom DND, both FRITZ!Box answering machines, Samsung Android DND, and GNOME DND without changing Samsung Sleep mode.
  triggers:
  - trigger: state
    entity_id: input_boolean.dnd_override
    to: 'on'
    id: enable
  - trigger: state
    entity_id: input_boolean.dnd_override
    to: 'off'
    id: disable
  - trigger: homeassistant
    event: start
    id: startup
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''enable'', ''startup''] and is_state(''input_boolean.dnd_override'', ''on'') }}'
      sequence:
      - action: shell_command.snom_dnd_set
        data:
          desired: 'on'
        response_variable: snom_master_result
      - if:
          condition: template
          value_template: '{{ snom_master_result[''returncode''] == 0 }}'
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.snom_dnd_state
      - action: shell_command.fritzbox_tam_set
        data:
          enabled: 'on'
        response_variable: fritzbox_master_result
      - if:
          condition: template
          value_template: '{{ fritzbox_master_result[''returncode''] == 0 }}'
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.fritz_ab_state
      - action: notify.mobile_app_sm_s931b
        data:
          message: command_dnd
          data:
            command: priority_only
        continue_on_error: true
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''disable'' }}'
      sequence:
      - if:
        - condition: state
          entity_id: input_boolean.work_mode_state
          state: 'off'
        - condition: state
          entity_id: input_boolean.sleep_mode_state
          state: 'off'
        then:
        - action: shell_command.snom_dnd_set
          data:
            desired: 'off'
          response_variable: snom_master_result
        - if:
            condition: template
            value_template: '{{ snom_master_result[''returncode''] == 0 }}'
          then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.snom_dnd_state
      - action: shell_command.fritzbox_tam_set
        data:
          enabled: 'off'
        response_variable: fritzbox_master_result
      - if:
          condition: template
          value_template: '{{ fritzbox_master_result[''returncode''] == 0 }}'
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.fritz_ab_state
      - action: notify.mobile_app_sm_s931b
        data:
          message: command_dnd
          data:
            command: 'off'
        continue_on_error: true
  mode: single
- id: calendar_shifts_wind_down_reminder
