      value_template: '{{ is_state(media_player.nils_s_fire_tv, playing) or is_state(media_player.fire_tv_wohnzimmer_alt, playing) }}'
    then:
    - action: media_player.media_pause
      target:
        entity_id: "{{ states.media_player | selectattr(entity_id, in, [media_player.nils_s_fire_tv, media_player.fire_tv_wohnzimmer_alt])\n   | selectattr(state, eq, playing) | map(attribute=entity_id) | list }}"
      continue_on_error: true
  - action: script.alexa_output_with_configured_volume
    data:
      output_type: announce
      output_target: media_player.uberall
      volume_targets:
      - media_player.schlafzimmer
      - media_player.arbeitszimmer
      - media_player.kuche
      - media_player.wohnzimmer
      - media_player.badezimmer
      message: "{% set hours = wind_down_lead_hours | float %} {% if hours == 0 %}\n  Es ist jetzt Schlafenszeit. Bitte beende Arbeit und Nebentätigkeiten und fahr langsam herunter.\n{% else %}\n  {% if hours == hours | int %}In {{ hours | int }}{% else %}In {{ hours | string | replace('.', ',') }}{% endif %} Stunden ist Schlafenszeit. Bitte beende jetzt Arbeit und Nebentätigkeiten und fahr langsam herunter.\n{% endif %}"
  mode: single
- id: calendar_shifts_shift_start_announcement
  alias: Calendar - Shifts - Schichtbeginn-Ansage
  description: Announces five minutes before a scheduled early or late shift on all Echo devices.
  triggers:
  - trigger: template
    id: early_shift_start_announcement
    value_template: '{% set t = states(''input_datetime.early_shift_start'').split('':'') %} {% set start_minutes = (t[0] | int) * 60 + (t[1] | int) %} {{ now().hour * 60 + now().minute == (start_minutes - 5) % 1440 }}'
  - trigger: template
    id: late_shift_start_announcement
    value_template: '{% set t = states(''input_datetime.late_shift_start'').split('':'') %} {% set start_minutes = (t[0] | int) * 60 + (t[1] | int) %} {{ now().hour * 60 + now().minute == (start_minutes - 5) % 1440 }}'
  actions:
  - variables:
      shift_name: '{{ ''Frühschicht'' if trigger.id == ''early_shift_start_announcement'' else ''Spätschicht'' }}'
  - action: calendar.get_events
    target:
      entity_id: calendar.shifts
    data:
      start_date_time: '{{ today_at(''00:00'').isoformat() }}'
      end_date_time: '{{ (today_at(''00:00'') + timedelta(days=1)).isoformat() }}'
    response_variable: shift_calendar
  - variables:
      shift_found: "{% set events = shift_calendar.get('calendar.shifts', {}).get('events', []) %} {% set ns = namespace(found=false) %} {% for event in events %}\n  {% set title = event.summary | default('') | lower %}\n  {% if (trigger.id == 'early_shift_start_announcement' and 'früh' in title)\n     or (trigger.id == 'late_shift_start_announcement' and 'spät' in title) %}\n    {% set ns.found = true %}\n  {% endif %}\n{% endfor %} {{ ns.found }}"
  - condition: template
    value_template: '{{ now().weekday() < 5 and shift_found | bool }}'
  - action: script.alexa_output_with_configured_volume
    data:
      output_type: announce
      output_target: media_player.uberall
      volume_targets:
      - media_player.schlafzimmer
      - media_player.arbeitszimmer
      - media_player.kuche
      - media_player.wohnzimmer
      - media_player.badezimmer
      message: In fünf Minuten beginnt deine {{ shift_name }}.
  mode: single
- id: calendar_shifts_echo_clock_display
  alias: Calendar - Shifts - Echo display and bedroom wake lights
  description: Shows the bedroom Echo clock and turns on the bedside and standing lamps during the calculated wake window for shifts and eligible free weekdays.
  triggers:
  - trigger: template
    id: early_wake
    value_template: '{% set t = states(''input_datetime.early_shift_start'').split('':'') %} {% set start = (t[0] | int) * 60 + (t[1] | int) %} {% set lead = (states(''input_number.alarm_offset'') | float(0) * 60) | int %} {{ now().hour * 60 + now().minute == (start - lead) % 1440 }}'
  - trigger: template
    id: late_wake
    value_template: '{% set t = states(''input_datetime.late_shift_start'').split('':'') %} {% set start = (t[0] | int) * 60 + (t[1] | int) %} {% set lead = (states(''input_number.alarm_offset'') | float(0) * 60) | int %} {{ now().hour * 60 + now().minute == (start - lead) % 1440 }}'
  - trigger: template
    id: free_wake
    value_template: '{% set t = states(''input_datetime.free_shift_start'').split('':'') %} {% set start = (t[0] | int) * 60 + (t[1] | int) %} {% set lead = (states(''input_number.alarm_offset'') | float(0) * 60) | int %} {{ now().hour * 60 + now().minute == (start - lead) % 1440 }}'
  actions:
  - variables:
      shift_start_entity: '{{ ''input_datetime.early_shift_start'' if trigger.id.startswith(''early_'') else (''input_datetime.late_shift_start'' if trigger.id.startswith(''late_'') else ''input_datetime.free_shift_start'') }}'
      shift_day_offset: '{% set t = states(shift_start_entity).split('':'') %} {% set start = (t[0] | int) * 60 + (t[1] | int) %} {% set alarm = (states(''input_number.alarm_offset'') | float(0) * 60) | int %} {{ 1 if start - alarm < 0 else 0 }}'
  - action: calendar.get_events
    target:
      entity_id: calendar.shifts
    data:
      start_date_time: '{{ (today_at(''00:00'') + timedelta(days=shift_day_offset | int)).isoformat() }}'
      end_date_time: '{{ (today_at(''00:00'') + timedelta(days=(shift_day_offset | int) + 1)).isoformat() }}'
    response_variable: shift_calendar
  - action: calendar.get_events
    target:
      entity_id: calendar.deutschland_by
    data:
      start_date_time: '{{ (today_at(''00:00'') + timedelta(days=shift_day_offset | int)).isoformat() }}'
      end_date_time: '{{ (today_at(''00:00'') + timedelta(days=(shift_day_offset | int) + 1)).isoformat() }}'
    response_variable: holiday_calendar
  - action: calendar.get_events
    target:
      entity_id: calendar.feiertage_in_deutschland
    data:
      start_date_time: '{{ (today_at(''00:00'') + timedelta(days=shift_day_offset | int)).isoformat() }}'
      end_date_time: '{{ (today_at(''00:00'') + timedelta(days=(shift_day_offset | int) + 1)).isoformat() }}'
    response_variable: regional_holiday_calendar
  - variables:
      shift_events: '{{ shift_calendar.get(''calendar.shifts'', {}).get(''events'', []) }}'
      holiday_events: '{{ holiday_calendar.get(''calendar.deutschland_by'', {}).get(''events'', []) }}'
      regional_holiday_events: '{{ regional_holiday_calendar.get(''calendar.feiertage_in_deutschland'', {}).get(''events'', []) | map(attribute=''summary'') | map(''lower'') | select(''search'', ''mariä himmelfahrt'') | list }}'
      titles: '{{ shift_events | map(attribute=''summary'') | map(''lower'') | map(''trim'') | list }}'
      work_shift_found: '{% set event_titles = shift_events | map(attribute=''summary'') | map(''lower'') | map(''trim'') | list %}{% if trigger.id.startswith(''early_'') %}{{ ''frühschicht'' in event_titles or ''sv früh'' in event_titles or ''svv früh'' in event_titles }}{% elif trigger.id.startswith(''late_'') %}{{ ''spätschicht'' in event_titles or ''sv spät'' in event_titles or ''svv spät'' in event_titles }}{% else %}{{ (''freischicht'' in event_titles or ''support standby'' in event_titles) and ''4tw-frei'' not in event_titles and ''urlaub'' not in event_titles }}{% endif %}'
  - condition: template
    value_template: '{{ (today_at(''00:00'') + timedelta(days=shift_day_offset | int)).weekday() < 5 and work_shift_found | bool and not is_state(''input_select.work_schedule_mode'', ''Krank'') }}'
  - if:
    - condition: state
      entity_id: input_boolean.sleep_mode_state
      state: 'off'
    then:
    - action: media_player.play_media
      target:
        entity_id: media_player.schlafzimmer
      data:
        media_content_type: custom
        media_content_id: turn display on
      continue_on_error: true
  - if:
    - condition: template
      value_template: '{{ trigger.id.endswith(''_wake'') }}'
    then:
    - action: light.turn_on
      target:
        entity_id:
        - light.nachttischlampe_licht
        - light.stehlampe_schlafzimmer_licht
      continue_on_error: true
  mode: single
- id: calendar_shifts_echo_volume_schedule
  alias: Calendar - Shifts - Echo volume schedule
  description: Lowers all Echo volumes at 22:00, raises them when the bedroom Alexa alarm rings, and uses noon when no alarm is scheduled for today.
  triggers:
  - trigger: time
    id: quiet_22
    at: input_datetime.echo_quiet_time
  - trigger: time
    id: alexa_alarm
    at: sensor.schlafzimmer_next_alarm
  - trigger: time
    id: fallback_noon
    at: input_datetime.echo_fallback_time
  - trigger: state
    entity_id: input_boolean.sleep_mode_state
    from: 'off'
    to: 'on'
    id: sleep_mode_on
  - trigger: state
    entity_id: input_boolean.sleep_mode_state
    from: 'on'
    to: 'off'
    id: sleep_mode_off
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: quiet_22
      sequence:
      - action: media_player.volume_set
        target:
          entity_id:
          - media_player.schlafzimmer
          - media_player.arbeitszimmer
          - media_player.kuche
          - media_player.wohnzimmer
          - media_player.badezimmer
        data:
          volume_level: '{{ (states(''input_number.echo_night_volume'') | float(2)) / 10 }}'
    - conditions:
      - condition: trigger
        id: alexa_alarm
      - condition: state
        entity_id: input_boolean.sleep_mode_state
        state: 'off'
      sequence:
      - action: media_player.volume_set
        target:
          entity_id:
          - media_player.schlafzimmer
          - media_player.arbeitszimmer
          - media_player.kuche
          - media_player.wohnzimmer
          - media_player.badezimmer
        data:
          volume_level: '{{ (states(''input_number.echo_day_volume'') | float(4.5)) / 10 }}'
    - conditions:
      - condition: trigger
        id: fallback_noon
      - condition: state
        entity_id: input_boolean.sleep_mode_state
        state: 'off'
      - condition: template
        value_template: '{% set next_alarm = states(''sensor.schlafzimmer_next_alarm'') | as_datetime(default=none) %} {{ next_alarm is none or next_alarm.date() != now().date() }}'
      sequence:
      - action: media_player.volume_set
        target:
          entity_id:
          - media_player.schlafzimmer
          - media_player.arbeitszimmer
          - media_player.kuche
          - media_player.wohnzimmer
          - media_player.badezimmer
        data:
          volume_level: '{{ (states(''input_number.echo_day_volume'') | float(4.5)) / 10 }}'
    - conditions:
      - condition: trigger
        id: sleep_mode_on
      sequence:
      - action: media_player.volume_set
        target:
          entity_id:
          - media_player.schlafzimmer
          - media_player.arbeitszimmer
          - media_player.kuche
          - media_player.wohnzimmer
          - media_player.badezimmer
        data:
          volume_level: '{{ (states(''input_number.echo_night_volume'') | float(3)) / 10 }}'
    - conditions:
      - condition: trigger
        id: sleep_mode_off
      sequence:
      - action: media_player.volume_set
        target:
          entity_id:
          - media_player.schlafzimmer
          - media_player.arbeitszimmer
          - media_player.kuche
          - media_player.wohnzimmer
          - media_player.badezimmer
        data:
          volume_level: >-
            {% set quiet_time = today_at(states('input_datetime.echo_quiet_time')) %}
            {% set fallback_time = today_at(states('input_datetime.echo_fallback_time')) %}
            {% set next_alarm = states('sensor.schlafzimmer_next_alarm') | as_datetime(default=none) %}
            {% set alarm_today = next_alarm is not none and next_alarm.date() == now().date() %}
            {% set scheduled_day = (alarm_today and now() >= next_alarm) or (not alarm_today and now() >= fallback_time and now() < quiet_time) %}
            {% set day_volume = (states('input_number.echo_day_volume') | float(4.5)) / 10 %}
            {% set night_volume = (states('input_number.echo_night_volume') | float(3)) / 10 %}
            {{ day_volume if scheduled_day else night_volume }}
  mode: single
- id: calendar_shifts_freischicht_dynamic_heating
  alias: Calendar - Shifts - Freischicht-Heizzeiten
  initial_state: false
  description: Derives weekday free-shift heating times from the GUI work-start helper, duration derived from the regular shift helpers, and shared preheat settings.
  triggers:
  - trigger: template
    id: free_living_morning_on
    value_template: '{% set t = states(''input_datetime.free_shift_start'').split('':'') %} {% set start = (t[0] | int) * 60 + (t[1] | int) %} {% set alarm = (states(''input_number.alarm_offset'') | float(1) * 60) | int %} {% set preheat = ((states(''input_number.heating_preheat_offset'') | float(1) * 60) | int) %} {{ now().hour * 60 + now().minute == (start - alarm - preheat) % 1440 }}'
  - trigger: template
    id: free_living_work_start
    value_template: '{% set t = states(''input_datetime.free_shift_start'').split('':'') %} {% set start = (t[0] | int) * 60 + (t[1] | int) %} {{ now().hour * 60 + now().minute == (start - (((states(''input_number.heating_cooldown_offset'') | float(0.5) * 60) | int))) % 1440 }}'
  - trigger: template
    id: free_office_start
    value_template: '{% set t = states(''input_datetime.free_shift_start'').split('':'') %} {% set start = (t[0] | int) * 60 + (t[1] | int) %} {% set preheat = ((states(''input_number.heating_preheat_offset'') | float(1) * 60) | int) %} {{ now().hour * 60 + now().minute == (start - preheat) % 1440 }}'
  - trigger: template
    id: free_office_end
    value_template: '{% set t = states(''input_datetime.free_shift_start'').split('':'') %} {% set start = (t[0] | int) * 60 + (t[1] | int) %} {% set regular_start = states(''input_datetime.early_shift_start'').split('':'') %} {% set regular_end = states(''input_datetime.early_shift_end'').split('':'') %} {% set duration = ((regular_end[0] | int) * 60 + (regular_end[1] | int)) - ((regular_start[0] | int) * 60 + (regular_start[1] | int)) %} {{ now().hour * 60 + now().minute == (start + duration - (((states(''input_number.heating_cooldown_offset'') | float(0.5) * 60) | int))) % 1440 }}'
  - trigger: template
    id: free_living_return_on
    value_template: '{% set t = states(''input_datetime.free_shift_start'').split('':'') %} {% set start = (t[0] | int) * 60 + (t[1] | int) %} {% set preheat = ((states(''input_number.heating_preheat_offset'') | float(1) * 60) | int) %} {% set regular_start = states(''input_datetime.early_shift_start'').split('':'') %} {% set regular_end = states(''input_datetime.early_shift_end'').split('':'') %} {% set duration = ((regular_end[0] | int) * 60 + (regular_end[1] | int)) - ((regular_start[0] | int) * 60 + (regular_start[1] | int)) %} {{ now().hour * 60 + now().minute == (start + duration - preheat) % 1440 }}'
  - trigger: template
    id: free_living_night_off
    value_template: '{% set t = states(''input_datetime.free_shift_start'').split('':'') %} {% set start = (t[0] | int) * 60 + (t[1] | int) %} {% set alarm = (states(''input_number.alarm_offset'') | float(1) * 60) | int %} {% set sleep = (states(''input_number.sleep_duration'') | float(9) * 60) | int %} {{ now().hour * 60 + now().minute == (start - alarm - sleep) % 1440 }}'
  actions:
  - variables:
      event_day_offset: '{% set t = states(''input_datetime.free_shift_start'').split('':'') %} {% set start = (t[0] | int) * 60 + (t[1] | int) %} {% set alarm = (states(''input_number.alarm_offset'') | float(1) * 60) | int %} {% set sleep = (states(''input_number.sleep_duration'') | float(9) * 60) | int %} {{ 0 }}'
  - action: calendar.get_events
    target:
      entity_id: calendar.shifts
    data:
      start_date_time: '{{ (today_at(''00:00'') + timedelta(days=event_day_offset | int)).isoformat() }}'
      end_date_time: '{{ (today_at(''00:00'') + timedelta(days=(event_day_offset | int) + 1)).isoformat() }}'
    response_variable: shift_calendar
  - action: calendar.get_events
    target:
      entity_id: calendar.deutschland_by
    data:
      start_date_time: '{{ (today_at(''00:00'') + timedelta(days=event_day_offset | int)).isoformat() }}'
      end_date_time: '{{ (today_at(''00:00'') + timedelta(days=(event_day_offset | int) + 1)).isoformat() }}'
    response_variable: holiday_calendar
  - action: calendar.get_events
    target:
      entity_id: calendar.feiertage_in_deutschland
    data:
      start_date_time: '{{ (today_at(''00:00'') + timedelta(days=event_day_offset | int)).isoformat() }}'
      end_date_time: '{{ (today_at(''00:00'') + timedelta(days=(event_day_offset | int) + 1)).isoformat() }}'
    response_variable: regional_holiday_calendar
  - variables:
      event_titles: '{{ shift_calendar.get(''calendar.shifts'', {}).get(''events'', []) | map(attribute=''summary'') | map(''lower'') | list }}'
      has_scheduled_shift: '{{ event_titles | select(''search'', ''(früh|spät|mittel|mittag|schicht)'') | list | length > 0 }}'
      has_calendar_free_day: '{{ event_titles | select(''search'', ''(4tw-frei|urlaub)'') | list | length > 0 }}'
      has_holiday: '{{ holiday_calendar.get(''calendar.deutschland_by'', {}).get(''events'', []) | length > 0 }}'
      has_local_bavarian_holiday: '{{ regional_holiday_calendar.get(''calendar.feiertage_in_deutschland'', {}).get(''events'', []) | map(attribute=''summary'') | map(''lower'') | select(''search'', ''mariä himmelfahrt'') | list | length > 0 }}'
  - condition: template
    value_template: '{{ (today_at(''00:00'') + timedelta(days=event_day_offset | int)).weekday() < 5 and not (has_scheduled_shift | bool) and not (has_calendar_free_day | bool) and not (has_holiday | bool) and not (has_local_bavarian_holiday | bool) }}'
  - condition: state
    entity_id: person.niwo
    state: home
  - choose:
    - conditions:
      - condition: trigger
        id: free_living_morning_on
      - condition: template
        value_template: '{{ not is_state(''binary_sensor.shellydw2_07a36f_door'', ''on'') and not is_state(''binary_sensor.shellydw2_a4cf12f4307a_door'', ''on'') }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.retry_living_room_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: '{{ states(''input_number.whz_target_temp'') | float(22) }}'
    - conditions:
      - condition: trigger
        id: free_living_work_start
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.retry_living_room_radiator_target
        data:
          variables:
            command_type: hvac_mode
            target_hvac_mode: false
    - conditions:
      - condition: trigger
        id: free_office_start
      - condition: template
        value_template: '{{ not is_state(''binary_sensor.shellydw2_aa9da4_door'', ''on'') and not is_state(''binary_sensor.shellydw2_6c3e7e_door'', ''on'') }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.shelly_retry_office_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: '{{ states(''input_number.az_target_temp'') | float(21) }}'
    - conditions:
      - condition: trigger
        id: free_office_end
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.shelly_retry_office_radiator_target
        data:
          variables:
            command_type: hvac_mode
            target_hvac_mode: false
    - conditions:
      - condition: trigger
        id: free_living_return_on
      - condition: template
        value_template: '{{ not is_state(''binary_sensor.shellydw2_07a36f_door'', ''on'') and not is_state(''binary_sensor.shellydw2_a4cf12f4307a_door'', ''on'') }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.retry_living_room_radiator_target
        data:
          variables:
            command_type: temperature
            target_temperature: '{{ states(''input_number.whz_target_temp'') | float(22) }}'
    - conditions:
      - condition: trigger
        id: free_living_night_off
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.retry_living_room_radiator_target
        data:
          variables:
            command_type: hvac_mode
            target_hvac_mode: false
  mode: queued
  max: 10
- id: calendar_shifts_cancel_alexa_alarms_when_sick
  alias: Calendar - Shifts - Cancel Alexa alarms when sick
  description: Cancels every active Alexa alarm on the Echo devices when the work mode changes to sick.
  triggers:
  - trigger: state
    entity_id: input_select.work_schedule_mode
    to: Krank
  actions:
  - delay: 00:00:02
  - variables:
      alarm_sources:
      - sensor: sensor.arbeitszimmer_next_alarm
        player: media_player.arbeitszimmer
      - sensor: sensor.badezimmer_next_alarm
        player: media_player.badezimmer
      - sensor: sensor.fire_tv_arbeitszimmer_next_alarm
        player: media_player.fire_tv_wohnzimmer_alt
      - sensor: sensor.nils_s_fire_tv_next_alarm
        player: media_player.nils_s_fire_tv
      - sensor: sensor.kuche_next_alarm
        player: media_player.kuche
      - sensor: sensor.schlafzimmer_next_alarm
        player: media_player.schlafzimmer
      - sensor: sensor.wohnzimmer_next_alarm
        player: media_player.wohnzimmer
  - variables:
      active_alarms: "{% set ns = namespace(items=[]) %} {% for source in alarm_sources %}\n  {% set alarm_data = state_attr(source.sensor, 'brief') %}\n  {% if alarm_data is mapping %}\n    {% for alarm in alarm_data.get('active', []) %}\n      {% if alarm.get('status') in ['ON', 'SNOOZED'] and alarm.get('date_time') %}\n        {% set ns.items = ns.items + [{'player': source.player, 'date_time': alarm.get('date_time')}] %}\n      {% endif %}\n    {% endfor %}\n  {% endif %}\n{% endfor %} {{ ns.items }}"
  - repeat:
      for_each: '{{ active_alarms }}'
      sequence:
      - action: script.alexa_output_with_configured_volume
        data:
          output_type: custom
          output_target: '{{ repeat.item.player }}'
          volume_targets:
          - '{{ repeat.item.player }}'
          message: Lösche meinen Wecker für {{ (repeat.item.date_time | as_datetime | as_local).strftime('%H:%M') }} Uhr
  mode: single
- id: calendar_shifts_sick_pill_reminder_20261014
  alias: Calendar - Shifts - Sick pill reminder
  description: Announces the sick-mode pill reminder at the late-shift start plus the configured sick offset.
  triggers:
  - trigger: template
    id: sick_pill_reminder
    value_template: '{% set shift_start = states(''input_datetime.late_shift_start'').split('':'') %} {% set shift_minutes = (shift_start[0] | int) * 60 + (shift_start[1] | int) %} {% set sick_offset_minutes = (states(''input_number.sick_temp_offset_tablettenerinnerung'') | float(2) * 60) | int %} {{ now().hour * 60 + now().minute == (shift_minutes + sick_offset_minutes) % 1440 }}'
  conditions:
  - condition: state
    entity_id: input_select.work_schedule_mode
    state: Krank
  actions:
  - variables:
      sick_offset_hours: '{{ states(''input_number.sick_temp_offset_tablettenerinnerung'') | float(2) }}'
  - action: script.alexa_output_with_configured_volume
    data:
      output_type: announce
      output_target: media_player.uberall
      volume_targets:
      - media_player.schlafzimmer
      - media_player.arbeitszimmer
      - media_player.kuche
      - media_player.wohnzimmer
      - media_player.badezimmer
      message: "{% if sick_offset_hours | float == 0 %}\n  Denk daran, deine Tabletten einzunehmen. Deine Spätschicht beginnt jetzt.\n{% else %}\n  Denk daran, deine Tabletten einzunehmen. Die Krank-Erinnerung ist {{ sick_offset_hours }} Stunden nach dem üblichen Spätschichtbeginn.\n{% endif %}"
  mode: single
