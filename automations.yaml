    - conditions:
      - condition: template
        value_template: '{{ ''spät'' in shift_titles and ''4tw-frei'' not in shift_titles and ''urlaub'' not in shift_titles and states(''input_select.work_schedule_mode'') == ''Automatisch'' }}'
      sequence:
      - action: script.alexa_output_with_configured_volume
        data:
          output_type: custom
          output_target: media_player.schlafzimmer
          volume_targets:
          - media_player.schlafzimmer
          message: Stell den Wecker für morgen früh um {{ late_alarm_time }} Uhr mit meinen Lieblingssongs
    - conditions:
      - condition: template
        value_template: '{{ (''freischicht'' in shift_titles or ''support standby'' in shift_titles) and ''4tw-frei'' not in shift_titles and ''urlaub'' not in shift_titles and states(''input_select.work_schedule_mode'') != ''Krank'' }}'
      sequence:
      - action: script.alexa_output_with_configured_volume
        data:
          output_type: custom
          output_target: media_player.schlafzimmer
          volume_targets:
          - media_player.schlafzimmer
