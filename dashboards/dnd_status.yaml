type: entities
title: DND Status (Hold to reset)
entities:
  - type: custom:template-entity-row
    name: Global DND requirement
    icon: >-
      {{ 'mdi:bell-ring' if is_state('input_boolean.snom_dnd_state', 'on') else 'mdi:bell-off' }}
    state: ""
    active: "{{ 'on' if is_state('input_boolean.snom_dnd_state', 'on') else '' }}"
    color: "{{ '#ffd54f' if is_state('input_boolean.snom_dnd_state', 'on') else 'var(--secondary-text-color)' }}"
    tap_action:
      action: none
  - type: section
    label: GNOME
  - entity: switch.gnome_dnd_niwo
    name: GNOME (niwo)
    hold_action:
      action: call-service
      service: input_select.select_option
      target:
        entity_id: input_select.gnome_dnd_niwo_policy
      data:
        option: Follow global
  - entity: switch.gnome_dnd_work
    name: GNOME (work)
    hold_action:
      action: call-service
      service: input_select.select_option
      target:
        entity_id: input_select.gnome_dnd_work_policy
      data:
        option: Follow global
  - type: section
    label: Phone
  - entity: switch.snom_dnd_control
    name: Snom
    hold_action:
      action: call-service
      service: input_select.select_option
      target:
        entity_id: input_select.snom_dnd_policy
      data:
        option: Follow global
  - entity: switch.samsung_s25_dnd_control
    name: Samsung S25
    hold_action:
      action: call-service
      service: input_select.select_option
      target:
        entity_id: input_select.samsung_s25_dnd_policy
      data:
        option: Follow global
  - type: section
    label: Echo
  - entity: switch.schlafzimmer_do_not_disturb_switch
    name: Echo Schlafzimmer
  - entity: switch.arbeitszimmer_do_not_disturb_switch
    name: Echo Arbeitszimmer
  - entity: switch.kuche_do_not_disturb_switch
    name: Echo Küche
  - entity: switch.wohnzimmer_do_not_disturb_switch
    name: Echo Wohnzimmer
  - entity: switch.badezimmer_do_not_disturb_switch
    name: Echo Badezimmer
show_header_toggle: false
state_color: true
color: state
grid_options:
  rows: 4
  columns: 12
