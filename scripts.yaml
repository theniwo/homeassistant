new_script:
  alias: New Script
  sequence:
  - condition: and
    conditions:
    - condition: or
      conditions: []
  mode: parallel
retry_office_radiator_target:
  alias: Shelly - Retry office radiator target
  description: Retries the Shelly TRV command every 60 seconds until a fresh device report confirms the
    requested state. It uses pushed updates instead of polling.
  mode: restart
  fields:
    command_type:
      name: Command type
      description: Select the climate command to send.
      required: true
      selector:
        select:
          options:
          - temperature
          - hvac_mode
          - preset_mode
    target_temperature:
      name: Target temperature
      selector:
        number:
          min: 4
          max: 31
          step: 0.5
          unit_of_measurement: °C
    target_hvac_mode:
      name: Target HVAC mode
      selector:
        select:
          options:
          - 'off'
          - heat
    target_preset_mode:
      name: Target preset
      selector:
        text: null
  sequence:
  - variables:
      requested_command: '{{ command_type | default(''temperature'') | lower }}'
      requested_temperature: '{{ target_temperature | default(4) | float(4) }}'
      requested_hvac_mode: '{{ target_hvac_mode | default(''off'') | lower }}'
      requested_preset_mode: '{{ target_preset_mode | default(''none'') }}'
      command_confirmed: false
      command_already_confirmed: '{% if requested_command == ''temperature'' %} {{ states(''climate.shellytrv_8cf681e113d0'')
        not in [''unknown'', ''unavailable''] and is_state(''climate.shellytrv_8cf681e113d0'', ''heat'')
        and (((state_attr(''climate.shellytrv_8cf681e113d0'', ''temperature'') | float(-1000)) - (requested_temperature
        | float)) | abs < 0.1) }} {% elif requested_command == ''hvac_mode'' %} {{ states(''climate.shellytrv_8cf681e113d0'')
        not in [''unknown'', ''unavailable''] and is_state(''climate.shellytrv_8cf681e113d0'', requested_hvac_mode)
        }} {% else %} {{ states(''climate.shellytrv_8cf681e113d0'') not in [''unknown'', ''unavailable'']
        and state_attr(''climate.shellytrv_8cf681e113d0'', ''preset_mode'') == requested_preset_mode }}
        {% endif %}'
  - condition: template
    value_template: '{{ requested_command in [''temperature'', ''hvac_mode'', ''preset_mode''] }}'
  - condition: template
    value_template: '{{ not (command_already_confirmed | default(false) | bool) }}'
  - repeat:
      sequence:
      - variables:
          report_timestamp_before: '{{ states[''climate.shellytrv_8cf681e113d0''].last_reported_timestamp
            | float(0) }}'
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ states(''climate.shellytrv_8cf681e113d0'') not in [''unknown'', ''unavailable'']
              }}'
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ requested_command == ''temperature'' }}'
              sequence:
              - action: climate.set_temperature
                target:
                  entity_id: climate.shellytrv_8cf681e113d0
                data:
                  temperature: '{{ requested_temperature }}'
                  hvac_mode: heat
                continue_on_error: true
            - conditions:
              - condition: template
                value_template: '{{ requested_command == ''hvac_mode'' }}'
              sequence:
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.shellytrv_8cf681e113d0
                data:
                  hvac_mode: '{{ requested_hvac_mode }}'
                continue_on_error: true
            - conditions:
              - condition: template
                value_template: '{{ requested_command == ''preset_mode'' }}'
              sequence:
              - action: climate.set_preset_mode
                target:
                  entity_id: climate.shellytrv_8cf681e113d0
                data:
                  preset_mode: '{{ requested_preset_mode }}'
                continue_on_error: true
      - delay:
          seconds: 60
      - variables:
          report_confirmed: '{{ states[''climate.shellytrv_8cf681e113d0''].last_reported_timestamp | float(0)  >
            (report_timestamp_before | float(0)) }}}}'
          command_confirmed: "{% if requested_command == 'temperature' %}\n  {{ (report_confirmed | bool)\n\
            \     and is_state('climate.shellytrv_8cf681e113d0', 'heat')\n     and ((state_attr('climate.shellytrv_8cf681e113d0',\
            \ 'temperature') | float(-1000)\n           - (requested_temperature | float)) | abs < 0.1)\
            \ }}\n{% elif requested_command == 'hvac_mode' %}\n  {{ (report_confirmed | bool)\n     and\
            \ states('climate.shellytrv_8cf681e113d0') not in ['unknown', 'unavailable']\n     and is_state('climate.shellytrv_8cf681e113d0',\
            \ requested_hvac_mode) }}\n{% else %}\n  {{ (report_confirmed | bool)\n     and states('climate.shellytrv_8cf681e113d0')\
            \ not in ['unknown', 'unavailable']\n     and state_attr('climate.shellytrv_8cf681e113d0',\
            \ 'preset_mode') == requested_preset_mode }}\n{% endif %}"
      until:
      - condition: template
        value_template: '{{ command_confirmed | default(false) | bool }}'
