alexa_output_with_configured_volume:
  alias: Alexa - Output at configured volume
  description: Applies the configured announcement volume to every target Echo, then restores the previous or scheduled volume.
  mode: queued
  max: 10
  fields:
    output_type:
      name: Output type
      required: true
      selector:
        select:
          options:
          - announce
          - custom
    output_target:
      name: Alexa output target
      required: true
      selector:
        text: null
    output_targets:
      name: Alexa announcement recipients
      required: false
      selector:
        entity:
          multiple: true
          filter:
            domain: media_player
    volume_targets:
      name: Echo devices whose volume should be adjusted
      required: true
      selector:
        entity:
          multiple: true
          filter:
            domain: media_player
    message:
      name: Announcement or command text
      required: true
      selector:
        text:
          multiline: true
  sequence:
  - variables:
      previous_volumes: >-
        {% set ns = namespace(values=[]) %}
        {% set quiet_time = today_at(states('input_datetime.echo_volume_quiet_time')) %}
        {% set fallback_time = today_at(states('input_datetime.echo_volume_fallback_time')) %}
        {% set next_alarm = states('sensor.schlafzimmer_next_alarm') | as_datetime(default=none) %}
        {% set alarm_today = next_alarm is not none and next_alarm.date() == now().date() %}
        {% set day_volume = (states('input_number.echo_day_volume') | float(4.5)) / 10 %}
        {% set night_volume = (states('input_number.echo_night_volume') | float(2)) / 10 %}
        {% set scheduled_day = (alarm_today and now() >= next_alarm) or (not alarm_today and now() >= fallback_time and now() < quiet_time) %}
        {% set scheduled_volume = day_volume if scheduled_day else night_volume %}
        {% for entity_id in volume_targets %}
          {% set current_volume = state_attr(entity_id, 'volume_level') %}
          {% set ns.values = ns.values + [current_volume if current_volume is not none else scheduled_volume] %}
        {% endfor %}
        {{ ns.values }}
      configured_volume: '{{ (states(''input_number.echo_announcement_volume'') | float(3)) / 10 }}'
      night_volume: '{{ (states(''input_number.echo_night_volume'') | float(3)) / 10 }}'
      sleep_mode_active: "{{ is_state('input_boolean.sleep_mode_calendar', 'on') }}"
      announcement_targets: "{{ output_targets | default(volume_targets if output_target in ['media_player.uberall', 'media_player.uberall_2'] else [output_target]) }}"
      previous_dnd_switches: >-
        {% set switch_by_player = {
          'media_player.schlafzimmer': 'switch.schlafzimmer_do_not_disturb_switch',
          'media_player.arbeitszimmer': 'switch.arbeitszimmer_do_not_disturb_switch',
          'media_player.kuche': 'switch.kuche_do_not_disturb_switch',
          'media_player.wohnzimmer': 'switch.wohnzimmer_do_not_disturb_switch',
          'media_player.badezimmer': 'switch.badezimmer_do_not_disturb_switch'
        } %}
        {% set ns = namespace(values=[]) %}
        {% for entity_id in announcement_targets %}
          {% set switch_entity = switch_by_player.get(entity_id) %}
          {% if switch_entity and is_state(switch_entity, 'on') %}
            {% set ns.values = ns.values + [switch_entity] %}
          {% endif %}
        {% endfor %}
        {{ ns.values }}
      announcement_restore_delay: "{{ [((message | string | length / 15) | round(0, 'ceil') | int + 5), 90] | min }}"
  - if:
    - condition: template
      value_template: "{{ output_type == 'announce' }}"
    then:
    - if:
      - condition: template
        value_template: "{{ previous_dnd_switches | length > 0 }}"
      then:
      - action: switch.turn_off
        target:
          entity_id: '{{ previous_dnd_switches }}'
        continue_on_error: true
      - wait_template: "{{ expand(previous_dnd_switches) | selectattr('state', 'eq', 'off') | list | count == previous_dnd_switches | count }}"
        timeout: '00:00:05'
        continue_on_timeout: true
    - repeat:
        for_each: '{{ volume_targets }}'
        sequence:
        - action: media_player.volume_set
          target:
            entity_id: '{{ repeat.item }}'
          data:
            volume_level: '{{ night_volume if sleep_mode_active | bool else configured_volume }}'
          continue_on_error: true
  - delay:
      seconds: 1
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ output_type == ''custom'' }}'
      sequence:
      - action: media_player.play_media
        target:
          entity_id: '{{ output_target }}'
        data:
          media_content_type: custom
          media_content_id: '{{ message }}'
        continue_on_error: true
    default:
    - action: notify.alexa_media
      data:
        target: '{{ announcement_targets }}'
        message: '{{ message }}'
        data:
          type: announce
      continue_on_error: true
  - delay:
      seconds: "{{ announcement_restore_delay if output_type == 'announce' else 10 }}"
  - if:
    - condition: template
      value_template: "{{ output_type == 'announce' }}"
    then:
    - if:
      - condition: template
        value_template: "{{ previous_dnd_switches | length > 0 }}"
      then:
      - action: switch.turn_on
        target:
          entity_id: '{{ previous_dnd_switches }}'
        continue_on_error: true
    - choose:
      - conditions:
        - condition: state
          entity_id: input_boolean.sleep_mode_calendar
          state: 'on'
        sequence:
        - repeat:
            for_each: '{{ volume_targets }}'
            sequence:
            - action: media_player.volume_set
              target:
                entity_id: '{{ repeat.item }}'
              data:
                volume_level: '{{ night_volume }}'
              continue_on_error: true
      default:
      - repeat:
          for_each: '{{ volume_targets }}'
          sequence:
          - variables:
              previous_volume: '{{ previous_volumes[repeat.index - 1] | default(none) }}'
          - if:
            - condition: template
              value_template: '{{ previous_volume is not none }}'
            then:
            - action: media_player.volume_set
              target:
                entity_id: '{{ repeat.item }}'
              data:
                volume_level: '{{ previous_volume }}'
              continue_on_error: true
master_dnd_override_on:
  alias: Master DND override ON
  sequence:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.master_dnd_override
  mode: single
master_dnd_override_off:
  alias: Master DND override OFF
  sequence:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.master_dnd_override
  mode: single
sleep_mode_toggle:
  alias: Sleep Mode umschalten
  description: Toggles Sleep Mode through the existing activation and shutdown sequences.
  mode: single
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.sleep_mode_calendar
        state: 'on'
      sequence:
      - action: script.sleep_mode_end_now
    default:
    - action: script.sleep_mode_now
sleep_mode_now:
  alias: Sleep Mode jetzt
  description: Activates Samsung Sleep mode, Snom DND, FRITZ!Box answering machines, sleep heating, bedtime announcements,
    and the bedroom display state.
  mode: single
  sequence:
  - condition: state
    entity_id: input_boolean.sleep_mode_calendar
    state: 'off'
  - action: notify.mobile_app_samsung_s25
    data:
      message: command_activity
      data:
        intent_action: android.intent.action.MAIN
        intent_package_name: com.samsung.android.app.routines
        intent_class_name: com.samsung.android.app.routines.ui.shortcut.ShortcutLaunchActivity
        intent_extras: EXTRA_KEY_ROUTINE_UUID:{{ states('input_text.samsung_sleep_mode_id') | trim }}:long
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.sleep_mode_calendar
  - action: shell_command.snom_dnd_set
    data:
      desired: 'on'
    response_variable: snom_dnd_result
  - if:
    - condition: template
      value_template: '{{ snom_dnd_result[''returncode''] == 0 }}'
    then:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.snom_dnd_calendar
  - action: shell_command.fritzbox_tam_set
    data:
      enabled: 'on'
    response_variable: fritzbox_tam_result
  - if:
    - condition: template
      value_template: '{{ fritzbox_tam_result[''returncode''] == 0 }}'
    then:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.fritz_box_answering_machines_calendar
  - action: script.alexa_output_with_configured_volume
    data:
      output_type: announce
      output_target: media_player.uberall
      volume_targets:
      - media_player.schlafzimmer
      - media_player.arbeitszimmer
      - media_player.kuche
      - media_player.wohnzimmer
      - media_player.badezimmer
      message: Es ist Zeit, schlafen zu gehen.
  - action: media_player.play_media
    target:
      entity_id: media_player.schlafzimmer
    data:
      media_content_type: custom
      media_content_id: turn off display
    continue_on_error: true
sleep_mode_end_now:
  alias: Sleep Mode beenden
  description: Turns off Samsung Sleep mode and releases scheduled DND and answering-machine states when sickness or the master
    override does not require them.
  mode: single
  sequence:
  - condition: state
    entity_id: input_boolean.sleep_mode_calendar
    state: 'on'
  - action: notify.mobile_app_samsung_s25
    data:
      message: command_activity
      data:
        intent_action: android.intent.action.MAIN
        intent_package_name: com.samsung.android.app.routines
        intent_class_name: com.samsung.android.app.routines.ui.shortcut.ShortcutLaunchActivity
        intent_extras: EXTRA_KEY_ROUTINE_UUID:{{ states('input_text.samsung_sleep_mode_id') | trim }}:long
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.sleep_mode_calendar
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not is_state(''input_select.arbeitsmodus'', ''Krank'') and is_state(''input_boolean.master_dnd_override'',
          ''off'') and is_state(''input_boolean.snom_dnd_calendar'', ''on'') }}'
      sequence:
      - action: shell_command.snom_dnd_set
        data:
          desired: 'off'
        response_variable: snom_dnd_result
      - if:
        - condition: template
          value_template: '{{ snom_dnd_result[''returncode''] == 0 }}'
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.snom_dnd_calendar
    - conditions:
      - condition: template
        value_template: '{{ not is_state(''input_select.arbeitsmodus'', ''Krank'') and is_state(''input_boolean.master_dnd_override'',
          ''off'') and is_state(''input_boolean.fritz_box_answering_machines_calendar'', ''on'') }}'
      sequence:
      - action: shell_command.fritzbox_tam_set
        data:
          enabled: 'off'
        response_variable: fritzbox_tam_result
      - if:
        - condition: template
          value_template: '{{ fritzbox_tam_result[''returncode''] == 0 }}'
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.fritz_box_answering_machines_calendar


calendar_shifts_refresh_tomorrow_and_set_alarm:
  alias: Calendar - Shifts - Refresh tomorrow and set alarm
  description: Refreshes tomorrow's calendar, sets the matching Alexa alarm, updates the dashboard, and announces any overdue bedtime reminders.
  mode: single
  sequence:
    - action: automation.trigger
      target:
        entity_id: automation.calendar_schicht_wecker_fur_morgen
    - delay:
        seconds: 7
    - action: automation.trigger
      target:
        entity_id: automation.calendar_shifts_tomorrow_status_panel
    - delay:
        seconds: 7
    - action: script.calendar_shifts_announce_tomorrow_status
    - variables:
        shift_status: "{{ states('input_text.tomorrow_shift_status') }}"
        shift_label: "{{ shift_status.split(' · ')[0] }}"
        shift_start_entity: >-
          {% if shift_label == 'Frühschicht' %}input_datetime.early_shift_start
          {% elif shift_label == 'Spätschicht' %}input_datetime.late_shift_start
          {% else %}input_datetime.freischicht_arbeitsbeginn{% endif %}
        shift_start_minutes: >-
          {% set t = states(shift_start_entity).split(':') %}
          {{ (t[0] | int) * 60 + (t[1] | int) }}
        alarm_lead_minutes: "{{ (states('input_number.alarm_before_shift') | float(1) * 60) | int }}"
        sleep_minutes: "{{ (states('input_number.sleep_time') | float(9) * 60) | int }}"
        wind_down_minutes: "{{ (states('input_number.wind_down_lead_time') | float(2) * 60) | int }}"
        pill_lead_minutes: "{{ ((states('input_number.pill_bedtime_lead_time') | float(0.5) * 60) | int) }}"
        alarm_raw_minutes: "{{ (shift_start_minutes | int) - (alarm_lead_minutes | int) }}"
        bedtime_raw_minutes: "{{ (alarm_raw_minutes | int) - (sleep_minutes | int) }}"
        wind_down_raw_minutes: "{{ (bedtime_raw_minutes | int) - (wind_down_minutes | int) }}"
        dnd_lead_minutes: "{{ ((states('input_number.dnd_lead_time') | float(1) * 60) | int) }}"
        dnd_raw_minutes: "{{ (bedtime_raw_minutes | int) - (dnd_lead_minutes | int) }}"
        dnd_datetime: "{{ today_at('00:00') + timedelta(days=1, minutes=(dnd_raw_minutes | int)) }}"
        dnd_schedule_is_eligible: "{{ shift_label in ['Frühschicht', 'Spätschicht', 'Freischicht', 'Support Standby'] and (today_at('00:00') + timedelta(days=1)).weekday() < 5 }}"
        dnd_is_due: "{{ dnd_schedule_is_eligible | bool and (dnd_datetime | as_datetime) <= now() }}"
        pill_raw_minutes: "{{ (bedtime_raw_minutes | int) - (pill_lead_minutes | int) }}"
        alarm_datetime: "{{ today_at('00:00') + timedelta(days=1, minutes=(alarm_raw_minutes | int)) }}"
        bedtime_datetime: "{{ today_at('00:00') + timedelta(days=1, minutes=(bedtime_raw_minutes | int)) }}"
        wind_down_datetime: "{{ today_at('00:00') + timedelta(days=1, minutes=(wind_down_raw_minutes | int)) }}"
        pill_datetime: "{{ today_at('00:00') + timedelta(days=1, minutes=(pill_raw_minutes | int)) }}"
        schedule_is_supported: "{{ shift_label in ['Frühschicht', 'Spätschicht'] and 'Runterfahren' in shift_status and (today_at('00:00') + timedelta(days=1)).weekday() < 5 and not is_state('input_select.arbeitsmodus', 'Krank') }}"
        wind_down_is_overdue: "{{ schedule_is_supported | bool and (wind_down_datetime | as_datetime) <= now() }}"
        pill_is_overdue: "{{ schedule_is_supported | bool and (pill_datetime | as_datetime) <= now() }}"
        bedtime_is_overdue: "{{ schedule_is_supported | bool and (bedtime_datetime | as_datetime) <= now() }}"
        alarm_is_future: "{{ (alarm_datetime | as_datetime) > now() }}"
        alarm_time_spoken: >-
          {% set local_time = alarm_datetime | as_datetime | as_local %}
          {{ local_time.hour }} Uhr{% if local_time.minute > 0 %} {{ local_time.minute }}{% endif %}
        wind_down_time_spoken: >-
          {% set local_time = wind_down_datetime | as_datetime | as_local %}
          {{ local_time.hour }} Uhr{% if local_time.minute > 0 %} {{ local_time.minute }}{% endif %}
        bedtime_time_spoken: >-
          {% set local_time = bedtime_datetime | as_datetime | as_local %}
          {{ local_time.hour }} Uhr{% if local_time.minute > 0 %} {{ local_time.minute }}{% endif %}
        pill_time_spoken: >-
          {% set local_time = pill_datetime | as_datetime | as_local %}
          {{ local_time.hour }} Uhr{% if local_time.minute > 0 %} {{ local_time.minute }}{% endif %}
        bedtime_since: >-
          {% if (bedtime_datetime | as_datetime).date() == now().date() %}heute um {{ bedtime_time_spoken }}
          {% elif (bedtime_datetime | as_datetime).date() == (now() - timedelta(days=1)).date() %}gestern um {{ bedtime_time_spoken }}
          {% else %}am {{ (bedtime_datetime | as_datetime).strftime('%d.%m.') }} um {{ bedtime_time_spoken }}{% endif %}
        pill_since: >-
          {% if (pill_datetime | as_datetime).date() == now().date() %}heute um {{ pill_time_spoken }}
          {% elif (pill_datetime | as_datetime).date() == (now() - timedelta(days=1)).date() %}gestern um {{ pill_time_spoken }}
          {% else %}am {{ (pill_datetime | as_datetime).strftime('%d.%m.') }} um {{ pill_time_spoken }}{% endif %}
        wind_down_since: >-
          {% if (wind_down_datetime | as_datetime).date() == now().date() %}heute um {{ wind_down_time_spoken }}
          {% elif (wind_down_datetime | as_datetime).date() == (now() - timedelta(days=1)).date() %}gestern um {{ wind_down_time_spoken }}
          {% else %}am {{ (wind_down_datetime | as_datetime).strftime('%d.%m.') }} um {{ wind_down_time_spoken }}{% endif %}
        remaining_seconds: "{{ [(alarm_datetime | as_datetime - now()).total_seconds() | int, 0] | max }}"
        remaining_hours: "{{ (remaining_seconds | int) // 3600 }}"
        remaining_minutes: "{{ ((remaining_seconds | int) % 3600) // 60 }}"
    - if:
        - condition: template
          value_template: "{{ dnd_is_due | bool and is_state('input_boolean.master_dnd_override', 'off') }}"
      then:
        - if:
            - condition: state
              entity_id: input_boolean.snom_dnd_calendar
              state: 'off'
          then:
            - action: shell_command.snom_dnd_set
              data:
                desired: 'on'
              response_variable: snom_dnd_result
            - if:
                - condition: template
                  value_template: "{{ snom_dnd_result['returncode'] == 0 }}"
              then:
                - action: input_boolean.turn_on
                  target:
                    entity_id: input_boolean.snom_dnd_calendar
        - if:
            - condition: state
              entity_id: input_boolean.fritz_box_answering_machines_calendar
              state: 'off'
          then:
            - action: shell_command.fritzbox_tam_set
              data:
                enabled: 'on'
              response_variable: fritzbox_tam_result
            - if:
                - condition: template
                  value_template: "{{ fritzbox_tam_result['returncode'] == 0 }}"
              then:
                - action: input_boolean.turn_on
                  target:
                    entity_id: input_boolean.fritz_box_answering_machines_calendar
        - action: notify.mobile_app_samsung_s25
          data:
            message: command_dnd
            data:
              command: priority_only
    - if:
        - condition: template
          value_template: "{{ wind_down_is_overdue | bool or pill_is_overdue | bool or bedtime_is_overdue | bool }}"
      then:
        - action: script.alexa_output_with_configured_volume
          data:
            output_type: announce
            output_target: media_player.schlafzimmer
            output_targets:
              - media_player.schlafzimmer
              - media_player.arbeitszimmer
              - media_player.kuche
              - media_player.wohnzimmer
              - media_player.badezimmer
            volume_targets:
              - media_player.schlafzimmer
              - media_player.arbeitszimmer
              - media_player.kuche
              - media_player.wohnzimmer
              - media_player.badezimmer
            message: >-
              {% if wind_down_is_overdue | bool %}Die Runterfahrzeit war {{ wind_down_since }}. {% endif %}
              {% if pill_is_overdue | bool %}Die Tablettenerinnerung war {{ pill_since }}. Bitte nimm deine Tabletten ein. {% endif %}
              {% if bedtime_is_overdue | bool %}Schlafenszeit ist seit {{ bedtime_since }} angesagt. {% endif %}
              {% if not (bedtime_is_overdue | bool) and pill_is_overdue | bool %}Zubettgehzeit ist um {{ bedtime_time_spoken }}. {% endif %}
              {% if alarm_is_future | bool %}Bis zum Wecker um {{ alarm_time_spoken }} bleiben noch
              {% if remaining_hours | int > 0 %}{{ remaining_hours }} Stunden{% endif %}
              {% if remaining_hours | int > 0 and remaining_minutes | int > 0 %} und {% endif %}
              {% if remaining_minutes | int > 0 or remaining_hours | int == 0 %}{{ remaining_minutes }} Minuten{% endif %}.
              {% else %}Die Weckzeit um {{ alarm_time_spoken }} ist bereits vorbei.{% endif %}


calendar_shifts_announce_tomorrow_status:
  alias: Calendar - Shifts - Announce tomorrow status
  description: Announces the completed tomorrow calendar check and planned alarm on all Echo devices.
  mode: single
  sequence:
    - variables:
        schedule_status: "{{ states('input_text.tomorrow_shift_status') }}"
        schedule_parts: "{{ schedule_status.split(' · ') }}"
        dnd_time_value: "{{ (schedule_parts[1] if schedule_parts | length > 1 else '') | replace('DND ', '') }}"
        wind_down_time_value: "{{ (schedule_parts[2] if schedule_parts | length > 2 else '') | replace('Runterfahren ', '') }}"
        bedtime_time_value: "{{ (schedule_parts[3] if schedule_parts | length > 3 else '') | replace('Schlafenszeit ', '') }}"
        alarm_time_value: "{{ (schedule_parts[4] if schedule_parts | length > 4 else '') | replace('Wecker ', '') }}"
        dnd_time_spoken: >-
          {% set time_parts = dnd_time_value.split(':') %}
          {{ time_parts[0] | int }} Uhr{% if time_parts | length > 1 and time_parts[1] | int > 0 %} {{ time_parts[1] | int }}{% endif %}
        wind_down_time_spoken: >-
          {% set time_parts = wind_down_time_value.split(':') %}
          {{ time_parts[0] | int }} Uhr{% if time_parts | length > 1 and time_parts[1] | int > 0 %} {{ time_parts[1] | int }}{% endif %}
        bedtime_time_spoken: >-
          {% set time_parts = bedtime_time_value.split(':') %}
          {{ time_parts[0] | int }} Uhr{% if time_parts | length > 1 and time_parts[1] | int > 0 %} {{ time_parts[1] | int }}{% endif %}
        alarm_time_spoken: >-
          {% set time_parts = alarm_time_value.split(':') %}
          {{ time_parts[0] | int }} Uhr{% if time_parts | length > 1 and time_parts[1] | int > 0 %} {{ time_parts[1] | int }}{% endif %}
        status_message: >-
          {% if 'Wecker ' in schedule_status and 'kein Wecker' not in schedule_status %}
            Kalenderabfrage für morgen abgeschlossen. {{ schedule_parts[0] }}.
            Nicht stören ab {{ dnd_time_spoken }}.
            Runterfahren um {{ wind_down_time_spoken }},
            Schlafenszeit um {{ bedtime_time_spoken }}.
            Der Wecker wurde für morgen um {{ alarm_time_spoken }} gestellt.
          {% else %}
            Kalenderabfrage für morgen abgeschlossen. {{ schedule_status | replace(' · ', '. ') }}.
          {% endif %}
    - action: script.alexa_output_with_configured_volume
      data:
        output_type: announce
        output_target: media_player.schlafzimmer
        output_targets:
          - media_player.schlafzimmer
          - media_player.arbeitszimmer
          - media_player.kuche
          - media_player.wohnzimmer
          - media_player.badezimmer
        volume_targets:
          - media_player.schlafzimmer
          - media_player.arbeitszimmer
          - media_player.kuche
          - media_player.wohnzimmer
          - media_player.badezimmer
        message: "{{ status_message }}"

calendar_shifts_verify_alexa_alarm:
  alias: Calendar - Shifts - Verify Alexa alarm
  description: Checks the next scheduled work alarm reported by Alexa Media Player and warns when it is missing at bedtime.
  mode: single
  fields:
    bedtime_check:
      name: Bedtime check
      required: false
      selector:
        boolean: null
  sequence:
  - action: homeassistant.update_entity
    target:
      entity_id: sensor.schlafzimmer_next_alarm
  - delay:
      seconds: 2
  - variables:
      alarm_status: "{{ states('sensor.alexa_wecker_status') }}"
      is_bedtime_check: "{{ bedtime_check | default(false) | bool }}"
      expected_time: "{{ alarm_status.split('·')[-1] | trim if '·' in alarm_status else '' }}"
      warning_needed: "{{ alarm_status.startswith('Fehlt') or alarm_status in ['Alexa-Daten nicht verfügbar', 'Nicht geprüft'] }}"
      warning_message: >-
        {% if alarm_status.startswith('Fehlt') %}
          Warnung: Der Alexa-Wecker für {{ expected_time }} Uhr ist nicht aktiv. Bitte stelle ihn manuell in der Alexa-App.
        {% else %}
          Home Assistant kann den aktiven Alexa-Wecker gerade nicht bestätigen. Bitte prüfe ihn in der Alexa-App.
        {% endif %}
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ warning_needed | bool }}'
      sequence:
      - action: persistent_notification.create
        data:
          notification_id: calendar_shifts_alexa_alarm_warning
          title: Alexa-Wecker prüfen
          message: '{{ warning_message }}'
      - action: notify.mobile_app_samsung_s25
        data:
          title: Alexa-Wecker prüfen
          message: '{{ warning_message }}'
      - if:
        - condition: template
          value_template: '{{ is_bedtime_check | bool }}'
        then:
        - action: script.alexa_output_with_configured_volume
          data:
            output_type: announce
            output_target: media_player.schlafzimmer
            output_targets:
            - media_player.schlafzimmer
            - media_player.arbeitszimmer
            - media_player.kuche
            - media_player.wohnzimmer
            - media_player.badezimmer
            volume_targets:
            - media_player.schlafzimmer
            - media_player.arbeitszimmer
            - media_player.kuche
            - media_player.wohnzimmer
            - media_player.badezimmer
            message: '{{ warning_message }}'
    default:
    - action: persistent_notification.dismiss
      data:
        notification_id: calendar_shifts_alexa_alarm_warning
      continue_on_error: true
    - if:
      - condition: template
        value_template: '{{ not (is_bedtime_check | bool) }}'
      then:
      - action: notify.mobile_app_samsung_s25
        data:
          title: Alexa-Weckerstatus
          message: >-
            {% if alarm_status.startswith('Aktiv') %}
              Der Alexa-Wecker für {{ expected_time }} Uhr ist aktiv.
            {% else %}
              {{ alarm_status }}.
            {% endif %}
